AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus account stack: the monthly cost budget for the account.
  Made by hand before the pipeline existed and adopted by import. The alert
  address is read from an SSM parameter at deploy time, never from Git.

Parameters:
  BudgetName:
    Type: String
  MonthlyLimitUsd:
    Type: String
    Default: "200"
    AllowedPattern: "^[0-9]+$"
  AlertEmail:
    Type: AWS::SSM::Parameter::Value<String>
    NoEcho: true
    Description: >-
      The NAME of an SSM String parameter (for example /<prefix>/budget-alert-email) that holds the alert address. CloudFormation
      resolves it at deploy time, so the address is never in Git, in a GitHub variable or in a workflow log. A person creates the
      parameter once. For an adopted budget its value must equal the live subscriber: NotificationsWithSubscribers cannot be updated
      in place (a difference replaces the budget, which the deployer refuses).

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Budget:
        BudgetName: !Ref BudgetName
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
        CostTypes:
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
