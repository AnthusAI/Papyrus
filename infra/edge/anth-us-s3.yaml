AWSTemplateFormatVersion: '2010-09-09'
Description: papyrus-edge-anth-us CloudFront distribution in front of the Anth.us S3 projection bucket
Parameters:
  CertificateArn:
    Type: String
  Aliases:
    Type: CommaDelimitedList
    Default: ''
  SiteBucketDomainName:
    Type: String
  RedirectsKeyValueStoreArn:
    Type: String
Conditions:
  HasAliases: !Not [!Equals [!Join ['', !Ref Aliases], '']]
Resources:
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: redirects (key-value store and patterns), index documents, static-hosting behaviour
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !Ref RedirectsKeyValueStoreArn
      FunctionCode: |
        import cf from "cloudfront";

        const redirectStore = cf.kvs();

        async function lookUpRedirectTarget(uri) {
          try {
            const target = await redirectStore.get(uri);
            return target ? String(target) : null;
          } catch (error) {
            return null;
          }
        }

        function rewriteToIndexDocument(uri) {
          if (uri === "/404") {
            return "/404.html";
          }
          if (uri.endsWith("/")) {
            return uri + "index.html";
          }
          const lastSegment = uri.substring(uri.lastIndexOf("/") + 1);
          if (lastSegment.indexOf(".") === -1) {
            return uri + "/index.html";
          }
          return uri;
        }

        // Pattern redirects: data from the site's projection.json, spliced between the markers at deploy
        // time by redirect-rules.ts. Each rule is {p: regex, t: target with $1..$9, s: status, x: excluded paths}.
        const patternRules = /*PAPYRUS_PATTERN_RULES*/[{"p":"^/blog/page/([^/]+)/$","t":"/articles/page/$1/","s":301,"x":[]},{"p":"^/blog/page/([^/]+)/index\\.html$","t":"/articles/page/$1/","s":301,"x":[]},{"p":"^/blog/([^/]+)/$","t":"/articles/$1/","s":301,"x":[]},{"p":"^/blog/([^/]+)/index\\.html$","t":"/articles/$1/","s":301,"x":[]},{"p":"^/biased-decisions(?:/(.*))?$","t":"https://biased-decisions.anth.us/$1","s":301,"x":[]},{"p":"^/(?!(?:.*/)?index\\.html$)(.+)\\.html$","t":"/$1/","s":301,"x":["/404.html"]},{"p":"^/((?:[^/]+/)*[^/.]+)$","t":"/$1/","s":301,"x":["/404"]}]/*END_PAPYRUS_PATTERN_RULES*/;

        function lookUpPatternRedirect(uri) {
          for (let index = 0; index < patternRules.length; index += 1) {
            const rule = patternRules[index];
            if (rule.x.indexOf(uri) !== -1) {
              continue;
            }
            const match = new RegExp(rule.p).exec(uri);
            if (match !== null) {
              return {
                status: rule.s,
                target: rule.t.replace(/\$([0-9])/g, function (whole, group) {
                  return match[Number(group)] || "";
                }),
              };
            }
          }
          return null;
        }

        // Content negotiation for agents: when the site publishes Markdown twins (standard front end, agents.markdown), a request
        // whose Accept header prefers text/markdown over text/html is rewritten to the .md object before the cache lookup. The
        // flag is spliced in by redirect-rules.ts at deploy time.
        const negotiateMarkdown = /*PAPYRUS_NEGOTIATE_MARKDOWN*/false/*END_PAPYRUS_NEGOTIATE_MARKDOWN*/;

        function qualityOf(accept, mediaType) {
          let quality = 0;
          const parts = accept.toLowerCase().split(",");
          for (let index = 0; index < parts.length; index += 1) {
            const fields = parts[index].split(";");
            if (fields[0].trim() !== mediaType) {
              continue;
            }
            quality = 1;
            for (let field = 1; field < fields.length; field += 1) {
              const pair = fields[field].trim();
              if (pair.indexOf("q=") === 0) {
                quality = Number(pair.substring(2));
                if (isNaN(quality)) {
                  quality = 0;
                }
              }
            }
          }
          return quality;
        }

        function prefersMarkdown(request) {
          const header = request.headers && request.headers.accept;
          if (!header || !header.value) {
            return false;
          }
          const markdown = qualityOf(header.value, "text/markdown");
          return markdown > 0 && markdown > qualityOf(header.value, "text/html");
        }

        function markdownTwin(uri) {
          if (uri === "/404.html" || uri.length < 6 || uri.substring(uri.length - 5) !== ".html") {
            return null;
          }
          return uri.substring(0, uri.length - 5) + ".md";
        }

        async function handler(event) {
          const request = event.request;
          const redirectTarget = await lookUpRedirectTarget(request.uri);
          if (redirectTarget !== null) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: redirectTarget } },
            };
          }
          const patternRedirect = lookUpPatternRedirect(request.uri);
          if (patternRedirect !== null) {
            return {
              statusCode: patternRedirect.status,
              statusDescription: "Moved",
              headers: { location: { value: patternRedirect.target } },
            };
          }
          request.uri = rewriteToIndexDocument(request.uri);
          if (negotiateMarkdown && prefersMarkdown(request)) {
            const twin = markdownTwin(request.uri);
            if (twin !== null) {
              request.uri = twin;
            }
          }
          return request;
        }
  ViewerResponseFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-response'
      AutoPublish: true
      FunctionConfig:
        Comment: cache-control and content-type values of the previous host
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        const HTML_CACHE_CONTROL = "public, max-age=0, s-maxage=60, must-revalidate";
        const ASSET_CACHE_CONTROL = "public, max-age=0, s-maxage=31536000";
        const UTF8_SUFFIX = "; charset=utf-8";

        function previousContentType(stored) {
          const withoutCharset = stored.endsWith(UTF8_SUFFIX) ? stored.substring(0, stored.length - UTF8_SUFFIX.length) : stored;
          return withoutCharset === "application/xml" ? "text/xml" : withoutCharset;
        }

        function handler(event) {
          const response = event.response;
          const headers = response.headers;
          if (headers["content-type"] !== undefined) {
            headers["content-type"] = { value: previousContentType(headers["content-type"].value) };
          }
          if (response.statusCode !== 200) {
            delete headers["cache-control"];
            return response;
          }
          const isHtml = headers["content-type"] !== undefined && headers["content-type"].value === "text/html";
          headers["cache-control"] = { value: isHtml ? HTML_CACHE_CONTROL : ASSET_CACHE_CONTROL };
          return response;
        }
  SiteBucketOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-bucket'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ReaderDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: anth.us reader (main)
        Aliases: !If [HasAliases, !Ref Aliases, !Ref 'AWS::NoValue']
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate: !If
          - HasAliases
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site-bucket
            DomainName: !Ref SiteBucketDomainName
            OriginAccessControlId: !GetAtt SiteBucketOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt ViewerResponseFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
Outputs:
  ReaderDistributionId: {Value: !Ref ReaderDistribution}
  ReaderDomain: {Value: !GetAtt ReaderDistribution.DomainName}
