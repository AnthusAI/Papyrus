AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus monitoring (PPY-3212f1): a scheduled Lambda that collects the public
  Hacker News feed into a DynamoDB table (collect, dedupe, checkpoint and receipts
  only), and a separate scheduled router Lambda that asks the shared Cyclotron which
  collected items each publication wants and delivers them to that publication's
  References queue (dry-run or live, as data in the table).

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the collector zip (the CDK assets bucket).
  CodeKey:
    Type: String
    Description: S3 key of the collector zip (content-hash named by build.sh).
  ReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the collector (1 keeps runs serial). 0 or less leaves it
      unreserved, for accounts whose Lambda concurrency quota is too low to reserve any.
      The table lease lock serializes runs either way.
  RouterCodeKey:
    Type: String
    Description: S3 key of the router zip (content-hash named by build.py --router), in CodeBucket.
  RouterReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the router. 0 leaves it unreserved (accounts whose Lambda quota is too
      low to reserve any). The table lease serializes runs either way.
  CyclotronInvokerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-machine-invoker
    Description: The one role in the shared Cyclotron account that the router may assume to call its machine API.
  CyclotronWorkerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-console-worker-runtime
    Description: The one role in the shared Cyclotron account that may put Decision Ready events on the doorbell bus (and only with source cyclotron.lab).
  AnthUsApiId:
    Type: String
    Default: 4qiunzl7drcedaz22rl4xu56ga
    Description: AppSync API id of the Anth.us backend.
  PapyrusApiId:
    Type: String
    Default: 36xh4ckhhvfyrlxxbltoy246ea
    Description: AppSync API id of the Papyrus product-site backend.
  ThreatIntelApiId:
    Type: String
    Default: gillpcb565fqrdrvqrijhqaily
    Description: AppSync API id of the Threat Intelligence backend.
  DataParadeApiId:
    Type: String
    Default: rgfkmmyyyrc7fb55qd5smbfrpm
    Description: AppSync API id of the Data Parade backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  PilobolusApiId:
    Type: String
    Default: 2tvll2u5ejafbmawb3v2sdonvi
    Description: AppSync API id of the Pilobolus backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  ShippedApiId:
    Type: String
    Default: 6sw6454pozbgvdgm233gqkxsxu
    Description: AppSync API id of the Shipped backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  DistinctiveApiId:
    Type: String
    Default: xcobakwl4jagvhdq54qc55flii
    Description: AppSync API id of the Distinctive Mark backend (the TTAB decisions monitor delivers there).
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  ProcedureRunnerFunctionName:
    Type: String
    Default: ""
    Description: >-
      Name of the procedure runner Lambda (infra/procedures). When set, the router may start it
      asynchronously for a publication's procedureTriggers. Empty leaves triggers recorded as startFailed.
  EditorUserPoolArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Exact Cognito pools for configured publications where email sender membership is rechecked.

  EmailReferenceMonitorId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,62}$"
    Description: Optional existing email partition whose editor-selected References need cloud predictions.
  EnrichmentOpenAiKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the OpenAI key for item enrichment summaries (gpt-6-luna). The router role may read only
      this parameter. Empty leaves summaries as the typed skip openai_not_configured.
  TavilyKeyParameter:
    Type: String
    Default: /papyrus/shared/tavily-api-key
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Tavily key for link-exploration search (environment variable
      PAPYRUS_TAVILY_KEY_PARAMETER). The role may read only this parameter and decrypt through SSM. Empty disables search.
  EditorialJudgmentKeyParameter:
    Type: String
    Default: /papyrus/shared/typesafe-api-key
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the TypeSafe key (TYPESAFE_API_KEY, the decision model) for the judgment lane of the Humanus editorial
      gate that checks each generated idea before the router files it (environment variable EDITORIAL_JUDGMENT_KEY_PARAMETER). One shared key for every
      routed site. The role may read only this parameter and decrypt through SSM. Empty, or a parameter that does not exist, leaves the judgment lane
      recorded as not run on the idea (the rules lane still runs).
  WebSearchProviders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(tavily|openai|perplexity|gemini|bedrock)(,(tavily|openai|perplexity|gemini|bedrock))*$"
    Description: >-
      Opt-in ordered web-search fallback chain for the collector and the router (environment variable WEB_SEARCH_PROVIDERS), for
      example "openai,tavily". A provider whose key is not configured is skipped; a provider whose plan is used up, whose key is
      refused or that stays rate limited falls through to the next. Empty keeps today's behaviour: Tavily alone. A monitor may
      override the chain with searchProviders in its own CONFIG.
  OpenAiSearchKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the OpenAI key for web search (environment variable PAPYRUS_OPENAI_KEY_PARAMETER);
      the standard name is /papyrus/search/openai-api-key. Empty leaves the openai provider unavailable.
  PerplexityKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Perplexity key (PAPYRUS_PERPLEXITY_KEY_PARAMETER); the standard name is
      /papyrus/search/perplexity-api-key. Empty leaves the perplexity provider unavailable.
  GeminiKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Gemini key (PAPYRUS_GEMINI_KEY_PARAMETER); the standard name is
      /papyrus/search/gemini-api-key. Empty leaves the gemini provider unavailable.
  BedrockWebSearch:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >-
      "on" lets the collector and the router sign a Bedrock token and use Web Search on Amazon Bedrock (provider "bedrock" in the
      chain): bedrock:CallWithBearerToken, bedrock-websearch:InvokeSearch / InvokeFetch and the Bedrock Mantle inference policy.
  BedrockSearchModel:
    Type: String
    Default: ""
    Description: >-
      The Bedrock model id used for provider "bedrock" (environment variable BEDROCK_SEARCH_MODEL). Required when BedrockWebSearch is
      "on"; with it empty the bedrock provider is skipped as unavailable.
  EnrichmentGrobidUrl:
    Type: String
    Default: ""
    Description: Optional GROBID service URL. Empty leaves research papers with the typed skip grobid_not_configured.

Conditions:
  HasEmailReferenceMonitor: !Not [!Equals [!Ref EmailReferenceMonitorId, ""]]
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  ReserveRouterConcurrency: !Not [!Equals [!Ref RouterReservedConcurrency, 0]]
  HasProcedureRunner: !Not [!Equals [!Ref ProcedureRunnerFunctionName, ""]]
  HasEditorUserPools: !Not [!Equals [!Join ["", !Ref EditorUserPoolArns], ""]]
  HasEnrichmentKey: !Not [!Equals [!Ref EnrichmentOpenAiKeyParameter, ""]]
  HasTavilyKey: !Not [!Equals [!Ref TavilyKeyParameter, ""]]
  HasEditorialJudgmentKey: !Not [!Equals [!Ref EditorialJudgmentKeyParameter, ""]]
  HasWebSearchChain: !Not [!Equals [!Ref WebSearchProviders, ""]]
  HasOpenAiSearchKey: !Not [!Equals [!Ref OpenAiSearchKeyParameter, ""]]
  HasPerplexityKey: !Not [!Equals [!Ref PerplexityKeyParameter, ""]]
  HasGeminiKey: !Not [!Equals [!Ref GeminiKeyParameter, ""]]
  HasBedrockWebSearch: !Equals [!Ref BedrockWebSearch, "on"]
  HasBedrockSearchModel: !Not [!Equals [!Ref BedrockSearchModel, ""]]
  HasEnrichmentGrobid: !Not [!Equals [!Ref EnrichmentGrobidUrl, ""]]

Resources:
  MonitoringTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: routing
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EnrichmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: purpose, Value: "item enrichment - captured article text and GROBID output - private to the router" }

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-collector
      RetentionInDays: 30

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CollectorLogGroup.Arn}:*"

  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: papyrus-monitoring-collector
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_cloud.handler
      MemorySize: 256
      Timeout: 120   # the real bound on a pass: keep in step with LAMBDA_TIMEOUT_SECONDS in monitoring_paging.py
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt CollectorRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          WEB_SEARCH_PROVIDERS: !If [HasWebSearchChain, !Ref WebSearchProviders, !Ref AWS::NoValue]
          PAPYRUS_OPENAI_KEY_PARAMETER: !If [HasOpenAiSearchKey, !Ref OpenAiSearchKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_PERPLEXITY_KEY_PARAMETER: !If [HasPerplexityKey, !Ref PerplexityKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_GEMINI_KEY_PARAMETER: !If [HasGeminiKey, !Ref GeminiKeyParameter, !Ref AWS::NoValue]
          BEDROCK_SEARCH_MODEL: !If [HasBedrockSearchModel, !Ref BedrockSearchModel, !Ref AWS::NoValue]

  ScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-collect
      Description: Run the HN collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  TtabCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-ttab-collect
      Description: Run the TTAB decisions collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"ttab"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  HuggingFaceCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-huggingface-collect
      Description: Run the Hugging Face Hub models collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"huggingface"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  WebCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-web-collect
      Description: >-
        Run every web-search monitor (web-<publication>) whose stored next-due time has passed, the longest-overdue first, sharing
        one pass's read time. A monitor that is disabled, not yet seeded or not due is skipped.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"sourceType":"web-search","monitorIds":["web-anth-us","web-p-apyr-us","web-threat-intelligence","web-data-parade","web-pilobol-us","web-shipped","web-distinctive"]}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-collector-errors
      AlarmDescription: The HN collector Lambda reported an error (failed fetch or crash). Read the latest run receipt.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref CollectorFunction }
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-router
      RetentionInDays: 30

  RouterDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: router
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${RouterLogGroup.Arn}:*"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn
              - Sid: CyclotronMachineInvoker
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref CyclotronInvokerRoleArn
              - Sid: PublicationReferenceIntake
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/updateReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/updateReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/itemBySlug"
