  ResearchWorkerBedrockWebSearchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasBedrockWebSearch
    Properties:
      Description: Lets the research worker use Web Search on Amazon Bedrock (provider "bedrock").
      Roles: [!Ref ResearchWorkerRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BedrockWebSearch
            Effect: Allow
            Action: [bedrock:CallWithBearerToken, "bedrock-websearch:InvokeSearch", "bedrock-websearch:InvokeFetch"]
            Resource: "*"

  ResearchWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-research-worker
      RetentionInDays: 30

  ResearchWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ResearchWorkerLogGroup
    Properties:
      FunctionName: papyrus-monitoring-research-worker
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_router.handler
      MemorySize: 1024   # a run holds every source it opens at once, PDFs included: 405 MB measured with 133 sources
      Timeout: 900   # the task's lock lease (960 s, TASK_LEASE_SECONDS) is longer than this, so one publication's runs never overlap
      Role: !GetAtt ResearchWorkerRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt RouterDeadLetterQueue.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref RouterCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_ROOT: /var/task
          PAPYRUS_GRAPHQL_AUTH: iam
          PAPYRUS_OPENAI_KEY_PARAMETER: !If [HasOpenAiSearchKey, !Ref OpenAiSearchKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_PERPLEXITY_KEY_PARAMETER: !If [HasPerplexityKey, !Ref PerplexityKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_GEMINI_KEY_PARAMETER: !If [HasGeminiKey, !Ref GeminiKeyParameter, !Ref AWS::NoValue]
          BEDROCK_SEARCH_MODEL: !If [HasBedrockSearchModel, !Ref BedrockSearchModel, !Ref AWS::NoValue]

  ResearchWorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ResearchWorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 900

  ResearchWorkerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ResearchWorkerFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn

  ResearchAssignmentsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-research-assignments
      Description: >-
        Every 5 minutes, start the research-assignments task for the hn monitor (docs/monitoring-cloud.md#research-assignments). It invokes the worker once per publication that turned
        researchAssignments on, and each run takes that publication's open research assignments oldest first. No retry: the next run repeats it.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt ResearchWorkerFunction.Arn
        RoleArn: !GetAtt ResearchWorkerScheduleRole.Arn
        Input: '{"task":"research-assignments","monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  RouterScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RouterFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn

  RouteSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-route
      Description: Run the HN router at minutes 7, 22, 37, 52 (offset from the collector's rate schedule); it routes in the mode stored in the table.
      ScheduleExpression: cron(7/15 * * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  RouterCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-router-collect
      Description: Collect the HN router's posted lab jobs every 2 minutes and deliver the finished ones. It posts nothing new and takes the same per-monitor router lock as the route run, so it never races it.
      ScheduleExpression: rate(2 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn","task":"collect"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 120
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  CyclotronDecisionsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: papyrus-cyclotron-decisions

  CyclotronDecisionsBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CyclotronDecisionsBus
      StatementId: CyclotronWorkerPutDecisionReady
      Statement:
        Effect: Allow
        Principal:
          AWS: !Ref CyclotronWorkerRoleArn
        Action: events:PutEvents
        Resource: !GetAtt CyclotronDecisionsBus.Arn
        Condition:
          StringEquals:
            events:source: cyclotron.lab

  DecisionReadyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: papyrus-monitoring-decision-ready
      Description: Doorbell. A Decision Ready event from the Cyclotron lab runs the router's collect task; the event carries no decision.
      EventBusName: !Ref CyclotronDecisionsBus
      State: !Ref ScheduleState
      EventPattern:
        source: [cyclotron.lab]
        detail-type: [Decision Ready]
      Targets:
        - Id: router-collect
          Arn: !GetAtt RouterFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt RouterDeadLetterQueue.Arn

  DecisionReadyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DecisionReadyRule.Arn

  DecisionReadyDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RouterDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt RouterDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt DecisionReadyRule.Arn

  EmailReferenceSchedule:
    Condition: HasEmailReferenceMonitor
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-email-references
      Description: Classify only References explicitly imported by editors from email receipts.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: !Sub '{"monitorId":"${EmailReferenceMonitorId}","task":"email-references"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  ReferencePredictionSchedule:
    Condition: HasReferencePredictionMonitor
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-reference-predictions
      Description: Drain the prediction requests the site backends queue when a Reference is created without one (src/papyrus_content/reference_prediction_queue.py). One indexed query when the lane is empty.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: !Sub '{"monitorId":"${ReferencePredictionMonitorId}","task":"email-references"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

