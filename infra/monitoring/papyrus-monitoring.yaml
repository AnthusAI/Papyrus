  RouterFunction:
    Type: AWS::Lambda::Function
    DependsOn: RouterLogGroup
    Properties:
      FunctionName: papyrus-monitoring-router
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_router.handler
      MemorySize: 512
      Timeout: 600
      ReservedConcurrentExecutions: !If [ReserveRouterConcurrency, !Ref RouterReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt RouterRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt RouterDeadLetterQueue.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref RouterCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_ROOT: /var/task
          PAPYRUS_GRAPHQL_AUTH: iam
          PROCEDURE_RUNNER_FUNCTION: !If [HasProcedureRunner, !Ref ProcedureRunnerFunctionName, !Ref AWS::NoValue]
          ENRICHMENT_BUCKET: !Ref EnrichmentBucket
          ENRICHMENT_OPENAI_KEY_PARAMETER: !If [HasEnrichmentKey, !Ref EnrichmentOpenAiKeyParameter, !Ref AWS::NoValue]
          EDITORIAL_JUDGMENT_KEY_PARAMETER: !If [HasEditorialJudgmentKey, !Ref EditorialJudgmentKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          WEB_SEARCH_PROVIDERS: !If [HasWebSearchChain, !Ref WebSearchProviders, !Ref AWS::NoValue]
          PAPYRUS_OPENAI_KEY_PARAMETER: !If [HasOpenAiSearchKey, !Ref OpenAiSearchKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_PERPLEXITY_KEY_PARAMETER: !If [HasPerplexityKey, !Ref PerplexityKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_GEMINI_KEY_PARAMETER: !If [HasGeminiKey, !Ref GeminiKeyParameter, !Ref AWS::NoValue]
          BEDROCK_SEARCH_MODEL: !If [HasBedrockSearchModel, !Ref BedrockSearchModel, !Ref AWS::NoValue]
          BIBLICUS_GROBID_URL: !If [HasEnrichmentGrobid, !Ref EnrichmentGrobidUrl, !Ref AWS::NoValue]

  RouterEnrichmentStoragePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Item enrichment: the router reads and writes captured text in its own private bucket, and reads back a delivered
        Reference's metadata attachment (createModelAttachmentDownload) when it copies the item's curation onto it.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnrichmentText
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub "${EnrichmentBucket.Arn}/enrichment/*"
          - Sid: ReadBackMetadataAttachment
            Effect: Allow
            Action: appsync:GraphQL
            Resource:
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DataParadeApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PilobolusApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ShippedApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DistinctiveApiId}/types/Mutation/fields/createModelAttachmentDownload"

  RouterEnrichmentKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasEnrichmentKey
    Properties:
      Description: Lets the router read the one SSM parameter that holds the enrichment OpenAI key.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadEnrichmentOpenAiKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnrichmentOpenAiKeyParameter}"

  RouterTavilyKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasTavilyKey
    Properties:
      Description: Lets the router read the one SSM parameter that holds the Tavily key for link search.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadTavilyKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TavilyKeyParameter}"
          - Sid: DecryptTavilyKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  CollectorTavilyKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasTavilyKey
    Properties:
      Description: Lets the collector read the one SSM parameter that holds the Tavily key for link search.
      Roles: [!Ref CollectorRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadTavilyKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TavilyKeyParameter}"
          - Sid: DecryptTavilyKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

