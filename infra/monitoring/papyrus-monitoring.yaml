      FunctionName: !Ref RouterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 900

  # The research-assignments task runs in its own function and role. RouterRole already has 20 managed policies, the most a role may have, so its grants cannot grow;
  # this role holds the same code zip, the same search and model key parameters (the key policies above name both roles) and exactly the fields the task asks for.
  ResearchWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: research-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ResearchWorkerLogGroup.Arn}:*"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn
              - Sid: FanOutPerPublication
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:papyrus-monitoring-research-worker"
              - Sid: ResearchAssignmentFields
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getAssignment"
