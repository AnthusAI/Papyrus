    Properties:
      Name: papyrus-monitoring-huggingface-route
      Description: Run the Hugging Face Hub models router hourly at minute 17; it routes in the mode stored in the table.
      ScheduleExpression: cron(17 * * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"huggingface"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  RouterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-router-errors
      AlarmDescription: The HN router Lambda reported an error (crash or timeout). Read the latest ROUTERUN receipt and the log group.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref RouterFunction }
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RouterDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-router-dead-letters
      AlarmDescription: A router invocation failed after delivery and was dead-lettered. Inspect the router queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt RouterDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  TableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /papyrus/monitoring/table-name
      Type: String
      Value: !Ref MonitoringTable
      Description: The monitoring table's name, so the newsroom Monitoring page (read-only) can find it without a deploy-time link between stacks.

Outputs:
  TableName:
    Value: !Ref MonitoringTable
  FunctionName:
    Value: !Ref CollectorFunction
  ScheduleName:
    Value: !Ref CollectSchedule
  DeadLetterQueueUrl:
    Value: !Ref ScheduleDeadLetterQueue
  RouterFunctionName:
    Value: !Ref RouterFunction
  RouterRoleArn:
    Value: !GetAtt RouterRole.Arn
  RouterScheduleName:
    Value: !Ref RouteSchedule
  RouterDeadLetterQueueUrl:
    Value: !Ref RouterDeadLetterQueue
  CyclotronDecisionsBusArn:
    Value: !GetAtt CyclotronDecisionsBus.Arn
