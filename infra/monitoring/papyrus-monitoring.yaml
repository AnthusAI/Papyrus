AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus monitoring (PPY-3212f1): a scheduled Lambda that collects the public
  Hacker News feed into a DynamoDB table (collect, dedupe, checkpoint and receipts
  only), and a separate scheduled router Lambda that asks the shared Cyclotron which
  collected items each publication wants and delivers them to that publication's
  References queue (dry-run or live, as data in the table).

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the collector zip (the CDK assets bucket).
  CodeKey:
    Type: String
    Description: S3 key of the collector zip (content-hash named by build.sh).
  ReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the collector (1 keeps runs serial). 0 or less leaves it
      unreserved, for accounts whose Lambda concurrency quota is too low to reserve any.
      The table lease lock serializes runs either way.
  RouterCodeKey:
    Type: String
    Description: S3 key of the router zip (content-hash named by build.py --router), in CodeBucket.
  RouterReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the router. 0 leaves it unreserved (accounts whose Lambda quota is too
      low to reserve any). The table lease serializes runs either way.
  CyclotronInvokerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-machine-invoker
    Description: The one role in the shared Cyclotron account that the router may assume to call its machine API.
  CyclotronWorkerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-console-worker-runtime
    Description: The one role in the shared Cyclotron account that may put Decision Ready events on the doorbell bus (and only with source cyclotron.lab).
  AnthUsApiId:
    Type: String
    Default: 4qiunzl7drcedaz22rl4xu56ga
    Description: AppSync API id of the Anth.us backend.
  PapyrusApiId:
    Type: String
    Default: 36xh4ckhhvfyrlxxbltoy246ea
    Description: AppSync API id of the Papyrus product-site backend.
  ThreatIntelApiId:
    Type: String
    Default: gillpcb565fqrdrvqrijhqaily
    Description: AppSync API id of the Threat Intelligence backend.
  DataParadeApiId:
    Type: String
    Default: rgfkmmyyyrc7fb55qd5smbfrpm
    Description: AppSync API id of the Data Parade backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  PilobolusApiId:
    Type: String
    Default: 2tvll2u5ejafbmawb3v2sdonvi
    Description: AppSync API id of the Pilobolus backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  ShippedApiId:
    Type: String
    Default: 6sw6454pozbgvdgm233gqkxsxu
    Description: AppSync API id of the Shipped backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  DistinctiveApiId:
    Type: String
    Default: xcobakwl4jagvhdq54qc55flii
    Description: AppSync API id of the Distinctive Mark backend (the TTAB decisions monitor delivers there).
  MachinesOnMachinesApiId:
    Type: String
    Default: lxyzo2l2pjftjdha7egy73wndu
    Description: AppSync API id of the Machines on Machines backend (a Cyclotron-decided publication; it replaces the Papyrus product-site backend, whose grants stay until that backend is retired).
  AnthUsVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Anth.us (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  AnthUsStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Anth.us (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  PapyrusVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of the Papyrus product site (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  PapyrusStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of the Papyrus product site (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  ThreatIntelVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Threat Intelligence (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  ThreatIntelStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Threat Intelligence (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  DataParadeVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Data Parade (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  DataParadeStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Data Parade (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  PilobolusVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Pilobolus (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  PilobolusStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Pilobolus (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  ShippedVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Shipped (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  ShippedStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Shipped (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  DistinctiveVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Distinctive Mark (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  DistinctiveStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Distinctive Mark (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  MachinesOnMachinesVectorIndexArn:
    Type: String
    Default: arn:aws:s3vectors:us-east-1:712236451410:bucket/unset-vector-bucket/index/unset-vector-index
    Description: >-
      ARN of the S3 Vectors index of Machines on Machines (its amplify_outputs.json custom.knowledgeQuery.s3VectorIndexArn). The default names no index, so the grant reads nothing until a change set fills it.
  MachinesOnMachinesStorageBucketName:
    Type: String
    Default: unset-storage-bucket
    Description: >-
      Name of the storage bucket of Machines on Machines (its amplify_outputs.json storage.bucket_name), read for the extracted text the vector index embeds. The default names no bucket.
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  ProcedureRunnerFunctionName:
    Type: String
    Default: ""
    Description: >-
      Name of the procedure runner Lambda (infra/procedures). When set, the router may start it
      asynchronously for a publication's procedureTriggers. Empty leaves triggers recorded as startFailed.
  EditorUserPoolArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Exact Cognito pools for configured publications where email sender membership is rechecked.

  AlarmEmailParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /papyrus/shipped/knowledge-run/alarm-email
    Description: SSM parameter holding the address alarm email goes to, the same mailbox as the knowledge runs. Never in the repository.

  # --- the operator alert listener (PPY-e92c8e, PPY-dd8c18); see docs/operator-alerts.md ---
  OperatorCodeKey:
    Type: String
    Description: S3 key of the operator zip (content-hash named by build.py --operator), in CodeBucket.
  OperatorSendingDomain:
    Type: String
    Default: notify.anth.us
    Description: Domain operator mail sends from (the SES identity of stack papyrus-newsletter-sending-operators). The sender is alerts at this domain.
  OperatorConfigurationSet:
    Type: String
    Default: papyrus-operators
    Description: SES configuration set operator mail sends with (no open or click tracking).
  OperatorsParameterName:
    Type: String
    Default: /papyrus/shipped/knowledge-run/alarm-email
    Description: >-
      Name of the SSM parameter holding the operator address, or several separated by commas. The default is the same mailbox the
      alarm topic's email subscription uses. Never in the repository.
  TriageParameterName:
    Type: String
    Default: /papyrus/monitoring/triage
    Description: >-
      Name of the optional JSON SSM parameter with portalUrl, roleName, accounts and sites (app id to site name). Written by hand, never
      in Git. When it does not exist, alarm links go to the plain CloudWatch console.
  TriageRoleName:
    Type: String
    Default: AdministratorAccess
    Description: >-
      IAM Identity Center permission set the alarm links open with when the triage parameter names none (and has a portalUrl).
      Change it to a read-only permission set when there is one.
  OperatorHeartbeatState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: DISABLED stops the 15 minute heartbeat, which makes the dead-man alarm fire after about 45 minutes. Used to prove the alarm.

  EmailReferenceMonitorId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,62}$"
    Description: Optional existing email partition whose editor-selected References need cloud predictions.
  ReferencePredictionMonitorId:
    Type: String
    Default: hn
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,62}$"
    Description: The partition the site backends queue Cyclotron prediction requests into (their monitoring.emailMonitorId, which defaults to hn). Its email-references task drains them. Empty turns the drain off.
  EnrichmentOpenAiKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the OpenAI key for item enrichment summaries (gpt-6-luna). The router role may read only
      this parameter. Empty leaves summaries as the typed skip openai_not_configured.
  TavilyKeyParameter:
    Type: String
    Default: /papyrus/shared/tavily-api-key
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Tavily key for link-exploration search (environment variable
      PAPYRUS_TAVILY_KEY_PARAMETER). The role may read only this parameter and decrypt through SSM. Empty disables search.
  EditorialJudgmentKeyParameter:
    Type: String
    Default: /papyrus/shared/typesafe-api-key
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the TypeSafe key (TYPESAFE_API_KEY, the decision model) for the judgment lane of the Humanus editorial
      gate that checks each generated idea before the router files it (environment variable EDITORIAL_JUDGMENT_KEY_PARAMETER). One shared key for every
      routed site. The role may read only this parameter and decrypt through SSM. Empty, or a parameter that does not exist, leaves the judgment lane
      recorded as not run on the idea (the rules lane still runs).
  WebSearchProviders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(tavily|openai|perplexity|gemini|bedrock)(,(tavily|openai|perplexity|gemini|bedrock))*$"
    Description: >-
      Opt-in ordered web-search fallback chain for the collector and the router (environment variable WEB_SEARCH_PROVIDERS), for
      example "openai,tavily". A provider whose key is not configured is skipped; a provider whose plan is used up, whose key is
      refused or that stays rate limited falls through to the next. Empty keeps today's behaviour: Tavily alone. A monitor may
      override the chain with searchProviders in its own CONFIG.
  OpenAiSearchKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the OpenAI key for web search (environment variable PAPYRUS_OPENAI_KEY_PARAMETER);
      the standard name is /papyrus/search/openai-api-key. Empty leaves the openai provider unavailable.
  PerplexityKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Perplexity key (PAPYRUS_PERPLEXITY_KEY_PARAMETER); the standard name is
      /papyrus/search/perplexity-api-key. Empty leaves the perplexity provider unavailable.
  GeminiKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Gemini key (PAPYRUS_GEMINI_KEY_PARAMETER); the standard name is
      /papyrus/search/gemini-api-key. Empty leaves the gemini provider unavailable.
  BedrockWebSearch:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >-
      "on" lets the collector and the router sign a Bedrock token and use Web Search on Amazon Bedrock (provider "bedrock" in the
      chain): bedrock:CallWithBearerToken, bedrock-websearch:InvokeSearch / InvokeFetch and the Bedrock Mantle inference policy.
  BedrockSearchModel:
    Type: String
    Default: ""
    Description: >-
      The Bedrock model id used for provider "bedrock" (environment variable BEDROCK_SEARCH_MODEL). Required when BedrockWebSearch is
      "on"; with it empty the bedrock provider is skipped as unavailable.
  EnrichmentGrobidUrl:
    Type: String
    Default: ""
    Description: Optional GROBID service URL. Empty leaves research papers with the typed skip grobid_not_configured.

Conditions:
  HasEmailReferenceMonitor: !Not [!Equals [!Ref EmailReferenceMonitorId, ""]]
  HasReferencePredictionMonitor: !And
    - !Not [!Equals [!Ref ReferencePredictionMonitorId, ""]]
    - !Not [!Equals [!Ref ReferencePredictionMonitorId, !Ref EmailReferenceMonitorId]]
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  ReserveRouterConcurrency: !Not [!Equals [!Ref RouterReservedConcurrency, 0]]
  HasProcedureRunner: !Not [!Equals [!Ref ProcedureRunnerFunctionName, ""]]
  HasEditorUserPools: !Not [!Equals [!Join ["", !Ref EditorUserPoolArns], ""]]
  HasEnrichmentKey: !Not [!Equals [!Ref EnrichmentOpenAiKeyParameter, ""]]
  HasTavilyKey: !Not [!Equals [!Ref TavilyKeyParameter, ""]]
  HasEditorialJudgmentKey: !Not [!Equals [!Ref EditorialJudgmentKeyParameter, ""]]
  HasWebSearchChain: !Not [!Equals [!Ref WebSearchProviders, ""]]
  HasOpenAiSearchKey: !Not [!Equals [!Ref OpenAiSearchKeyParameter, ""]]
  HasPerplexityKey: !Not [!Equals [!Ref PerplexityKeyParameter, ""]]
  HasGeminiKey: !Not [!Equals [!Ref GeminiKeyParameter, ""]]
  HasBedrockWebSearch: !Equals [!Ref BedrockWebSearch, "on"]
  HasBedrockSearchModel: !Not [!Equals [!Ref BedrockSearchModel, ""]]
  HasEnrichmentGrobid: !Not [!Equals [!Ref EnrichmentGrobidUrl, ""]]

Resources:
  MonitoringTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: routing
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EnrichmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: purpose, Value: "item enrichment - captured article text and GROBID output - private to the router" }

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-collector
      RetentionInDays: 30

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CollectorLogGroup.Arn}:*"

  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: papyrus-monitoring-collector
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_cloud.handler
      MemorySize: 256
      Timeout: 120   # the real bound on a pass: keep in step with LAMBDA_TIMEOUT_SECONDS in monitoring_paging.py
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt CollectorRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          WEB_SEARCH_PROVIDERS: !If [HasWebSearchChain, !Ref WebSearchProviders, !Ref AWS::NoValue]
          PAPYRUS_OPENAI_KEY_PARAMETER: !If [HasOpenAiSearchKey, !Ref OpenAiSearchKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_PERPLEXITY_KEY_PARAMETER: !If [HasPerplexityKey, !Ref PerplexityKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_GEMINI_KEY_PARAMETER: !If [HasGeminiKey, !Ref GeminiKeyParameter, !Ref AWS::NoValue]
          BEDROCK_SEARCH_MODEL: !If [HasBedrockSearchModel, !Ref BedrockSearchModel, !Ref AWS::NoValue]

  ScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-collect
      Description: Run the HN collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  TtabCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-ttab-collect
      Description: Run the TTAB decisions collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"ttab"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  HuggingFaceCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-huggingface-collect
      Description: Run the Hugging Face Hub models collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"huggingface"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  PapersArxivAiCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-papers-arxiv-ai-collect
      Description: Run the collector for the arXiv AI paper feed; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"papers-arxiv-ai"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  PapersArxivSecurityCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-papers-arxiv-security-collect
      Description: Run the collector for the arXiv security paper feed; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"papers-arxiv-security"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  PapersHuggingfaceCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-papers-huggingface-collect
      Description: Run the collector for the Hugging Face daily papers list; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"papers-huggingface"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  WebCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-web-collect
      Description: >-
        Run every web-search monitor (web-<publication>) whose stored next-due time has passed, the longest-overdue first, sharing
        one pass's read time. A monitor that is disabled, not yet seeded or not due is skipped.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"sourceType":"web-search","monitorIds":["web-anth-us","web-p-apyr-us","web-threat-intelligence","web-data-parade","web-pilobol-us","web-shipped","web-distinctive"]}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-collector-errors
      AlarmDescription: The HN collector Lambda reported an error (failed fetch or crash). Read the latest run receipt.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref CollectorFunction }
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  SearchProviderFailingMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CollectorLogGroup
      FilterPattern: '{ $.monitor = "search_provider_failing" }'
      MetricTransformations:
        - MetricNamespace: Papyrus/Monitoring
          MetricName: SearchProviderFailing
          MetricValue: "1"
          DefaultValue: 0

  SearchProviderFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-search-provider-failing
      AlarmDescription: >-
        A web-search provider refused the collector's key (authentication) or reported its plan used up (for example Tavily 432 or
        Perplexity 401). The collector logs one search_provider_failing line per provider and kind for each run; read them for the
        provider, kind and monitor, then renew the key or plan or drop the provider from WebSearchProviders. A day window, so a
        monitor that runs once a day stays in alarm until the provider answers again.
      Namespace: Papyrus/Monitoring
      MetricName: SearchProviderFailing
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-router
      RetentionInDays: 30

  RouterDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # One related-items check per Reference (reference_suggest_once.py). The vector pass sends a message when it stores a Reference's summary vector; the router
  # function takes it off and checks that one Reference. A message that fails is delivered again by SQS until MaxReceiveCount, then it waits in the dead-letter queue,
  # whose alarm tells a person. The visibility timeout is longer than the function's timeout, as an event source mapping requires.
  SuggestDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SuggestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800   # six times the worker's timeout, as the event source mapping advises
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SuggestDeadLetterQueue.Arn
        maxReceiveCount: 3

  SuggestWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-suggest-worker
      RetentionInDays: 30

  # The checks themselves: the same code zip and entry point as the router (a batch of SQS records goes to reference_suggest_once.handle_queue), in a function and role
  # of their own so they never wait behind the router's single execution. Exactly what a check asks for: the router's config row and the check records in its table,
  # the Reference and relation fields of suggest_for and link_references, the calibration read, and Get/Query on the sites' vector indexes. No writes to the vector index.
  SuggestWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: suggest-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt MonitoringTable.Arn
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${SuggestWorkerLogGroup.Arn}:*"
              - Sid: SuggestQueueConsume
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt SuggestQueue.Arn
              - Sid: SuggestionFields
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listReferencesByLineageAndVersion"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getSemanticNode"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listSemanticRelationsBySubjectState"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listSemanticRelationsByObjectState"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listSemanticRelationsByNewsroomFeedAndCreatedAt"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/updateSemanticRelation"
              - Sid: SiteVectorIndexes
                Effect: Allow
                Action:
                  - s3vectors:GetVectors
                  - s3vectors:QueryVectors
                Resource:
                  - !Ref AnthUsVectorIndexArn
                  - !Ref PapyrusVectorIndexArn
                  - !Ref ThreatIntelVectorIndexArn
                  - !Ref DataParadeVectorIndexArn
                  - !Ref PilobolusVectorIndexArn
                  - !Ref ShippedVectorIndexArn
                  - !Ref DistinctiveVectorIndexArn
                  - !Ref MachinesOnMachinesVectorIndexArn

  SuggestWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: SuggestWorkerLogGroup
    Properties:
      FunctionName: papyrus-monitoring-suggest-worker
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_router.handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt SuggestWorkerRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref RouterCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_ROOT: /var/task
          PAPYRUS_GRAPHQL_AUTH: iam

  SuggestEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref SuggestWorkerFunction
      EventSourceArn: !GetAtt SuggestQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2

  SuggestDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-suggest-dead-letters
      AlarmDescription: >-
        A Reference's related-items check failed three times and its message is waiting in the suggestion dead-letter queue. Read the router's
        {"suggestOnce": "failed"} log lines for the reason; after the cause is fixed, move the messages back to the suggestion queue (SQS redrive) or run the
        suggest-unchecked task.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt SuggestDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The monitor-stories queue (src/papyrus_content/ideas/story_plan.py). The daily task (the router function) only PLANS: it reads the publication once and sends one
  # message per candidate, packs and single items in the order it ranked them. StoryWorkerFunction drafts one message per invocation. A FIFO queue with the publication
  # as the message group, so a publication's steps run in order and one at a time (two publications may run side by side) and an idea is never filed against one filed a
  # moment before by the next step. A step that fails is delivered again until MaxReceiveCount, then waits in the dead-letter queue, whose alarm tells a person; the last
  # try leaves a record so the plan still finishes. The visibility timeout is six times the worker's timeout, as an event source mapping advises.
  StoryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600   # the plan's rows expire a day after this (PLAN_TTL_SECONDS)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StoryDeadLetterQueue.Arn
        maxReceiveCount: 3   # keep in step with MAXIMUM_RECEIVES in ideas/story_plan.py

  StoryWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-story-worker
      RetentionInDays: 30

  # One step of a plan: the same code zip and entry point as the router (an SQS event whose messages are story steps goes to monitoring_router.handle_story_queue), in a
  # function and role of its own because the router function is held to one execution at a time and RouterRole already has the 20 managed policies a role may have. The
  # role holds exactly what a step asks for: the router's table (the plan's rows, the retry memory), the queue, the model and search keys, and the AppSync fields of filing an
  # idea (the Item, its based_on and concept edges, the Humanus gate) and of the plan's review request and curation flag. The API is a wildcard, as in RouterIdeaPolicy.
  # test_monitor_stories_queue.py records every field a step asks for and checks this list covers it.
  StoryWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: story-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt MonitoringTable.Arn
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${StoryWorkerLogGroup.Arn}:*"
              - Sid: StoryQueueConsume
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt StoryQueue.Arn
              - Sid: StoryStepFields
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getItem"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getPublishedItem"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getReviewRequest"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/itemByTenantSlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getEditorialCheckSettings"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getEditorialContext"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/getEditorialCheckRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listEditorialFeedbacks"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listEditorialPolicies"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listItemsByLineageAndVersion"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listNewsroomSections"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listReferencesByLineageAndVersion"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Query/fields/listReviewRequests"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/createItem"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/updateItem"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/updateSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/createEditorialCheckRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/updateEditorialCheckRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/createReviewRequest"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*/types/Mutation/fields/updateReviewRequest"
              # The model key (the one item enrichment uses), the TypeSafe key of the gate's judgment lane and the search keys the link explorer uses. A parameter left at
              # its default names no parameter, so its grant reads nothing.
              - Sid: ReadKeys
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnrichmentOpenAiKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EditorialJudgmentKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TavilyKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAiSearchKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PerplexityKeyParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiKeyParameter}"
              - Sid: DecryptKeys
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              - Sid: BedrockWebSearch
                Effect: Allow
                Action: ["bedrock:CallWithBearerToken", "bedrock-websearch:InvokeSearch", "bedrock-websearch:InvokeFetch"]
                Resource: "*"

  StoryWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: StoryWorkerLogGroup
    Properties:
      FunctionName: papyrus-monitoring-story-worker
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_router.handler
      MemorySize: 1024   # a step holds the pages it opens, PDFs included
      Timeout: 300   # one step: 8 attempts took 199 s in the old run, 25 s each; the queue's visibility timeout is six times this
      Role: !GetAtt StoryWorkerRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref RouterCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_ROOT: /var/task
          PAPYRUS_GRAPHQL_AUTH: iam
          ENRICHMENT_OPENAI_KEY_PARAMETER: !If [HasEnrichmentKey, !Ref EnrichmentOpenAiKeyParameter, !Ref AWS::NoValue]
          EDITORIAL_JUDGMENT_KEY_PARAMETER: !If [HasEditorialJudgmentKey, !Ref EditorialJudgmentKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          WEB_SEARCH_PROVIDERS: !If [HasWebSearchChain, !Ref WebSearchProviders, !Ref AWS::NoValue]
          PAPYRUS_OPENAI_KEY_PARAMETER: !If [HasOpenAiSearchKey, !Ref OpenAiSearchKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_PERPLEXITY_KEY_PARAMETER: !If [HasPerplexityKey, !Ref PerplexityKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_GEMINI_KEY_PARAMETER: !If [HasGeminiKey, !Ref GeminiKeyParameter, !Ref AWS::NoValue]
          BEDROCK_SEARCH_MODEL: !If [HasBedrockSearchModel, !Ref BedrockSearchModel, !Ref AWS::NoValue]

  StoryEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref StoryWorkerFunction
      EventSourceArn: !GetAtt StoryQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2   # the least a mapping allows; a FIFO queue runs one publication's steps at a time whatever this is

  StoryDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-story-dead-letters
      AlarmDescription: >-
        A step of the daily monitor-stories plan failed three times and its message is waiting in the story dead-letter queue (the plan finished without it). Read the
        story worker's {"storyStep": "failed"} log lines for the reason; after the cause is fixed, move the message back to the story queue (SQS redrive).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt StoryDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns: !If
        - HasBedrockWebSearch
        - [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonBedrockMantleInferenceAccess"]
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: router
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${RouterLogGroup.Arn}:*"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn
              # The one-check-per-Reference suggestion queue (reference_suggest_once.py): the vector pass sends a message for each stored summary vector. The checks
              # run in their own function (SuggestWorkerFunction), because this one has a reserved concurrency of 1 and a queue consumer would be throttled for the
              # whole daily run, burning its receive count.
              - Sid: SuggestQueueSend
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SuggestQueue.Arn
              # The daily monitor-stories task plans and sends one message per step to the story queue; StoryWorkerFunction drafts them.
              - Sid: StoryQueueSend
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt StoryQueue.Arn
              - Sid: CyclotronMachineInvoker
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref CyclotronInvokerRoleArn
              - Sid: PublicationReferenceIntake
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/updateReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/completeModelAttachmentUpload"
