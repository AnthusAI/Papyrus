            Resource: "*"

  RouterProcedureRunnerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasProcedureRunner
    Properties:
      Description: Lets the router start the procedure runner asynchronously for procedureTriggers.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartProcedureRunner
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProcedureRunnerFunctionName}"

  RouterEditorMembershipPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasEditorUserPools
    Properties:
      Description: Read-only sender membership checks in the explicitly configured publication pools.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EmailEditorMembership
            Effect: Allow
            Action: [cognito-idp:ListUsers, cognito-idp:AdminListGroupsForUser]
            Resource: !Ref EditorUserPoolArns

  RouterInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RouterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 900

  RouterScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RouterFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn

  RouteSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-route
      Description: Run the HN router at minutes 7, 22, 37, 52 (offset from the collector's rate schedule); it routes in the mode stored in the table.
      ScheduleExpression: cron(7/15 * * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  RouterCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-router-collect
      Description: Collect the HN router's posted lab jobs every 2 minutes and deliver the finished ones. It posts nothing new and takes the same per-monitor router lock as the route run, so it never races it.
      ScheduleExpression: rate(2 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn","task":"collect"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 120
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  CyclotronDecisionsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: papyrus-cyclotron-decisions

  CyclotronDecisionsBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CyclotronDecisionsBus
      StatementId: CyclotronWorkerPutDecisionReady
      Statement:
        Effect: Allow
        Principal:
          AWS: !Ref CyclotronWorkerRoleArn
        Action: events:PutEvents
        Resource: !GetAtt CyclotronDecisionsBus.Arn
        Condition:
          StringEquals:
            events:source: cyclotron.lab

  DecisionReadyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: papyrus-monitoring-decision-ready
      Description: Doorbell. A Decision Ready event from the Cyclotron lab runs the router's collect task; the event carries no decision.
      EventBusName: !Ref CyclotronDecisionsBus
      State: !Ref ScheduleState
      EventPattern:
        source: [cyclotron.lab]
        detail-type: [Decision Ready]
      Targets:
        - Id: router-collect
          Arn: !GetAtt RouterFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt RouterDeadLetterQueue.Arn

  DecisionReadyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DecisionReadyRule.Arn

  DecisionReadyDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RouterDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt RouterDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt DecisionReadyRule.Arn

  EmailReferenceSchedule:
    Condition: HasEmailReferenceMonitor
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-email-references
      Description: Classify only References explicitly imported by editors from email receipts.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: !Sub '{"monitorId":"${EmailReferenceMonitorId}","task":"email-references"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

