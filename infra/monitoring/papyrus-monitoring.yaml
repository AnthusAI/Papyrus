  AutoAcceptSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-auto-accept
      Description: >-
        Every hour at minute 41, start the auto-accept task for the hn monitor (docs/monitoring-cloud.md#automatic-acceptance). The run accepts nothing
        itself: it invokes the router once per publication the monitor lists whose autoAccept is not off, so each publication has the Lambda's whole time
        budget and its own lock, and no routing run can use the time up first. No retry: the next hour repeats it.
      ScheduleExpression: cron(41 * * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"task":"auto-accept","monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

