  ResearchWorkerOpenAiSearchKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasOpenAiSearchKey
    Properties:
      Description: Lets the research worker read the one SSM parameter that holds the OpenAI key for web search.
      Roles: [!Ref ResearchWorkerRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOpenAiSearchKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAiSearchKeyParameter}"
          - Sid: DecryptOpenAiSearchKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  ResearchWorkerPerplexitySearchKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasPerplexityKey
    Properties:
      Description: Lets the research worker read the one SSM parameter that holds the Perplexity key for web search.
      Roles: [!Ref ResearchWorkerRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadPerplexitySearchKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PerplexityKeyParameter}"
          - Sid: DecryptPerplexitySearchKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
