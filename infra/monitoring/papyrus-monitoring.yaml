AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus monitoring (PPY-3212f1): a scheduled Lambda that collects the public
  Hacker News feed into a DynamoDB table. Collect, dedupe, checkpoint and
  receipts only; no publication, AppSync or provider access.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the collector zip (the CDK assets bucket).
  CodeKey:
    Type: String
    Description: S3 key of the collector zip (content-hash named by build.sh).
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

Resources:
  MonitoringTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: routing
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-collector
      RetentionInDays: 30

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CollectorLogGroup.Arn}:*"

  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: papyrus-monitoring-collector
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_cloud.handler
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Role: !GetAtt CollectorRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable

  ScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-collect
      Description: Run the HN collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-collector-errors
      AlarmDescription: The HN collector Lambda reported an error (failed fetch or crash). Read the latest run receipt.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref CollectorFunction }
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  TableName:
    Value: !Ref MonitoringTable
  FunctionName:
    Value: !Ref CollectorFunction
  ScheduleName:
    Value: !Ref CollectSchedule
  DeadLetterQueueUrl:
    Value: !Ref ScheduleDeadLetterQueue
