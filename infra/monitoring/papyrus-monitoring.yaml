AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus monitoring (PPY-3212f1): a scheduled Lambda that collects the public
  Hacker News feed into a DynamoDB table (collect, dedupe, checkpoint and receipts
  only), and a separate scheduled router Lambda that asks the shared Cyclotron which
  collected items each publication wants and delivers them to that publication's
  References queue (dry-run or live, as data in the table).

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the collector zip (the CDK assets bucket).
  CodeKey:
    Type: String
    Description: S3 key of the collector zip (content-hash named by build.sh).
  ReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the collector (1 keeps runs serial). 0 or less leaves it
      unreserved, for accounts whose Lambda concurrency quota is too low to reserve any.
      The table lease lock serializes runs either way.
  RouterCodeKey:
    Type: String
    Description: S3 key of the router zip (content-hash named by build.py --router), in CodeBucket.
  RouterReservedConcurrency:
    Type: Number
    Default: 1
    Description: >-
      Reserved concurrency for the router. 0 leaves it unreserved (accounts whose Lambda quota is too
      low to reserve any). The table lease serializes runs either way.
  CyclotronInvokerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-machine-invoker
    Description: The one role in the shared Cyclotron account that the router may assume to call its machine API.
  CyclotronWorkerRoleArn:
    Type: String
    Default: arn:aws:iam::682849160744:role/cyclotron-console-worker-runtime
    Description: The one role in the shared Cyclotron account that may put Decision Ready events on the doorbell bus (and only with source cyclotron.lab).
  AnthUsApiId:
    Type: String
    Default: 4qiunzl7drcedaz22rl4xu56ga
    Description: AppSync API id of the Anth.us backend.
  PapyrusApiId:
    Type: String
    Default: 36xh4ckhhvfyrlxxbltoy246ea
    Description: AppSync API id of the Papyrus product-site backend.
  ThreatIntelApiId:
    Type: String
    Default: gillpcb565fqrdrvqrijhqaily
    Description: AppSync API id of the Threat Intelligence backend.
  DataParadeApiId:
    Type: String
    Default: rgfkmmyyyrc7fb55qd5smbfrpm
    Description: AppSync API id of the Data Parade backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  PilobolusApiId:
    Type: String
    Default: 2tvll2u5ejafbmawb3v2sdonvi
    Description: AppSync API id of the Pilobolus backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  ShippedApiId:
    Type: String
    Default: 6sw6454pozbgvdgm233gqkxsxu
    Description: AppSync API id of the Shipped backend (a Cyclotron-decided publication, like Anth.us, Papyrus and Threat Intelligence).
  DistinctiveApiId:
    Type: String
    Default: xcobakwl4jagvhdq54qc55flii
    Description: AppSync API id of the Distinctive Mark backend (the TTAB decisions monitor delivers there).
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  ProcedureRunnerFunctionName:
    Type: String
    Default: ""
    Description: >-
      Name of the procedure runner Lambda (infra/procedures). When set, the router may start it
      asynchronously for a publication's procedureTriggers. Empty leaves triggers recorded as startFailed.
  EditorUserPoolArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Exact Cognito pools for configured publications where email sender membership is rechecked.

  EmailReferenceMonitorId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,62}$"
    Description: Optional existing email partition whose editor-selected References need cloud predictions.
  EnrichmentOpenAiKeyParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the OpenAI key for item enrichment summaries (gpt-6-luna). The router role may read only
      this parameter. Empty leaves summaries as the typed skip openai_not_configured.
  TavilyKeyParameter:
    Type: String
    Default: /papyrus/shared/tavily-api-key
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]{1,1010}$"
    Description: >-
      Name of the SSM SecureString holding the Tavily key for link-exploration search (environment variable
      PAPYRUS_TAVILY_KEY_PARAMETER). The role may read only this parameter and decrypt through SSM. Empty disables search.
  EnrichmentGrobidUrl:
    Type: String
    Default: ""
    Description: Optional GROBID service URL. Empty leaves research papers with the typed skip grobid_not_configured.

Conditions:
  HasEmailReferenceMonitor: !Not [!Equals [!Ref EmailReferenceMonitorId, ""]]
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  ReserveRouterConcurrency: !Not [!Equals [!Ref RouterReservedConcurrency, 0]]
  HasProcedureRunner: !Not [!Equals [!Ref ProcedureRunnerFunctionName, ""]]
  HasEditorUserPools: !Not [!Equals [!Join ["", !Ref EditorUserPoolArns], ""]]
  HasEnrichmentKey: !Not [!Equals [!Ref EnrichmentOpenAiKeyParameter, ""]]
  HasTavilyKey: !Not [!Equals [!Ref TavilyKeyParameter, ""]]
  HasEnrichmentGrobid: !Not [!Equals [!Ref EnrichmentGrobidUrl, ""]]

Resources:
  MonitoringTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: routing
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EnrichmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: purpose, Value: "item enrichment - captured article text and GROBID output - private to the router" }

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-collector
      RetentionInDays: 30

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${CollectorLogGroup.Arn}:*"

  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: papyrus-monitoring-collector
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_cloud.handler
      MemorySize: 256
      Timeout: 120   # the real bound on a pass: keep in step with LAMBDA_TIMEOUT_SECONDS in monitoring_paging.py
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt CollectorRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable

  ScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-collect
      Description: Run the HN collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  TtabCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-ttab-collect
      Description: Run the TTAB decisions collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"ttab"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  HuggingFaceCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-huggingface-collect
      Description: Run the Hugging Face Hub models collector; it skips itself until its stored next-due time.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt CollectorFunction.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"monitorId":"huggingface"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 3
        DeadLetterConfig:
          Arn: !GetAtt ScheduleDeadLetterQueue.Arn

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: papyrus-monitoring-collector-errors
      AlarmDescription: The HN collector Lambda reported an error (failed fetch or crash). Read the latest run receipt.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref CollectorFunction }
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/papyrus-monitoring-router
      RetentionInDays: 30

  RouterDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: router
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MonitoringTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MonitoringTable.Arn
                  - !Sub "${MonitoringTable.Arn}/index/routing"
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${RouterLogGroup.Arn}:*"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn
              - Sid: CyclotronMachineInvoker
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref CyclotronInvokerRoleArn
              - Sid: PublicationReferenceIntake
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/updateReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/updateReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getModelAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/getSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/itemBySlug"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/listKnowledgeCorpuses"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/listKnowledgeCorporaByRoleAndName"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/listReferences"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/completeModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createKnowledgeImportRun"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createMessage"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createModelAttachmentUpload"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createReference"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createReferenceAttachment"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createSemanticRelation"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/updateReferenceAttachment"

  RouterFunction:
    Type: AWS::Lambda::Function
    DependsOn: RouterLogGroup
    Properties:
      FunctionName: papyrus-monitoring-router
      Runtime: python3.13
      Architectures: [arm64]
      Handler: papyrus_content.monitoring_router.handler
      MemorySize: 512
      Timeout: 600
      ReservedConcurrentExecutions: !If [ReserveRouterConcurrency, !Ref RouterReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt RouterRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt RouterDeadLetterQueue.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref RouterCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitoringTable
          PAPYRUS_ROOT: /var/task
          PAPYRUS_GRAPHQL_AUTH: iam
          PROCEDURE_RUNNER_FUNCTION: !If [HasProcedureRunner, !Ref ProcedureRunnerFunctionName, !Ref AWS::NoValue]
          ENRICHMENT_BUCKET: !Ref EnrichmentBucket
          ENRICHMENT_OPENAI_KEY_PARAMETER: !If [HasEnrichmentKey, !Ref EnrichmentOpenAiKeyParameter, !Ref AWS::NoValue]
          PAPYRUS_TAVILY_KEY_PARAMETER: !If [HasTavilyKey, !Ref TavilyKeyParameter, !Ref AWS::NoValue]
          BIBLICUS_GROBID_URL: !If [HasEnrichmentGrobid, !Ref EnrichmentGrobidUrl, !Ref AWS::NoValue]

  RouterEnrichmentStoragePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Item enrichment: the router reads and writes captured text in its own private bucket, and reads back a delivered
        Reference's metadata attachment (createModelAttachmentDownload) when it copies the item's curation onto it.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnrichmentText
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub "${EnrichmentBucket.Arn}/enrichment/*"
          - Sid: ReadBackMetadataAttachment
            Effect: Allow
            Action: appsync:GraphQL
            Resource:
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PapyrusApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DataParadeApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PilobolusApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ShippedApiId}/types/Mutation/fields/createModelAttachmentDownload"
              - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DistinctiveApiId}/types/Mutation/fields/createModelAttachmentDownload"

  RouterEnrichmentKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasEnrichmentKey
    Properties:
      Description: Lets the router read the one SSM parameter that holds the enrichment OpenAI key.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadEnrichmentOpenAiKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnrichmentOpenAiKeyParameter}"

  RouterTavilyKeyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasTavilyKey
    Properties:
      Description: Lets the router read the one SSM parameter that holds the Tavily key for link search.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadTavilyKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TavilyKeyParameter}"
          - Sid: DecryptTavilyKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  RouterProcedureRunnerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasProcedureRunner
    Properties:
      Description: Lets the router start the procedure runner asynchronously for procedureTriggers.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartProcedureRunner
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProcedureRunnerFunctionName}"

  RouterEditorMembershipPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasEditorUserPools
    Properties:
      Description: Read-only sender membership checks in the explicitly configured publication pools.
      Roles: [!Ref RouterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EmailEditorMembership
            Effect: Allow
            Action: [cognito-idp:ListUsers, cognito-idp:AdminListGroupsForUser]
            Resource: !Ref EditorUserPoolArns

  RouterInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RouterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 900

  RouterScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-and-dead-letter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RouterFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RouterDeadLetterQueue.Arn

  RouteSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-route
      Description: Run the HN router at minutes 7, 22, 37, 52 (offset from the collector's rate schedule); it routes in the mode stored in the table.
      ScheduleExpression: cron(7/15 * * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  RouterCollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-hn-router-collect
      Description: Collect the HN router's posted lab jobs every 2 minutes and deliver the finished ones. It posts nothing new and takes the same per-monitor router lock as the route run, so it never races it.
      ScheduleExpression: rate(2 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: '{"monitorId":"hn","task":"collect"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 120
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

  CyclotronDecisionsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: papyrus-cyclotron-decisions

  CyclotronDecisionsBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CyclotronDecisionsBus
      StatementId: CyclotronWorkerPutDecisionReady
      Statement:
        Effect: Allow
        Principal:
          AWS: !Ref CyclotronWorkerRoleArn
        Action: events:PutEvents
        Resource: !GetAtt CyclotronDecisionsBus.Arn
        Condition:
          StringEquals:
            events:source: cyclotron.lab

  DecisionReadyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: papyrus-monitoring-decision-ready
      Description: Doorbell. A Decision Ready event from the Cyclotron lab runs the router's collect task; the event carries no decision.
      EventBusName: !Ref CyclotronDecisionsBus
      State: !Ref ScheduleState
      EventPattern:
        source: [cyclotron.lab]
        detail-type: [Decision Ready]
      Targets:
        - Id: router-collect
          Arn: !GetAtt RouterFunction.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt RouterDeadLetterQueue.Arn

  DecisionReadyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DecisionReadyRule.Arn

  DecisionReadyDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RouterDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt RouterDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt DecisionReadyRule.Arn

  EmailReferenceSchedule:
    Condition: HasEmailReferenceMonitor
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: papyrus-monitoring-email-references
      Description: Classify only References explicitly imported by editors from email receipts.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt RouterFunction.Arn
        RoleArn: !GetAtt RouterScheduleRole.Arn
        Input: !Sub '{"monitorId":"${EmailReferenceMonitorId}","task":"email-references"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 1
        DeadLetterConfig:
          Arn: !GetAtt RouterDeadLetterQueue.Arn

