# Copy to <site repo>/.github/workflows/deploy.yml (PUBLIC repositories only).
# CI runs on every push and pull request; a green push to main (a release: develop merged into main) starts the
# Amplify job for that exact commit through GitHub OIDC. Pushes to develop run CI only and build nothing in Amplify. Replace the CI steps with the repo's own checks and <siteId> with the
# site's id (the role is the stack output GithubDeployRoleArn).
#
# No AWS ids live in this file or anywhere else in the repository. Set two GitHub repository variables
# (Settings > Secrets and variables > Actions > Variables), from the stack outputs:
#   AWS_ACCOUNT_ID   the 12-digit AWS account the site deploys to
#   AMPLIFY_APP_ID   the Amplify app id (CmsAppId)
# They are variables, not secrets: they only need to stay out of Git. If one is missing the deploy job
# stops at its first step and names the variable.
name: CI and deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: ${{ vars.AMPLIFY_APP_ID }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      role-name: <siteId>-github-deploy
