AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Papyrus procedure runner (PPY-a2b94e): one container Lambda, with Tactus installed, that runs a
  newsroom's published Tactus procedure for one request and records the ProcedureRun in that newsroom.
  It is the consumer of every site's wake queue (PPY-567bf9): the monitoring router, Run now, the story-stage triggers and translate-on-publish
  start it by putting a wake on the site's queue (PPY-9a79b5 for the router's procedureTriggers).
  See docs/procedure-runner.md.

Parameters:
  ImageUri:
    Type: String
    Description: The runner image, by digest. The release builds it from this commit (infra/procedures/build_image.py) and passes it; nobody builds or pushes by hand.
  DistinctiveApiId:
    Type: String
    Description: AppSync API id of the Distinctive Mark backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdDistinctive output.
  AnthUsApiId:
    Type: String
    Description: AppSync API id of the Anth.us backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdAnthUs output.
  MachinesOnMachinesApiId:
    Type: String
    Description: AppSync API id of the Machines on Machines backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdMachinesOnMachines output.
  ThreatIntelApiId:
    Type: String
    Description: AppSync API id of the Threat Intelligence backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdThreatIntel output.
  DataParadeApiId:
    Type: String
    Description: AppSync API id of the Data Parade backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdDataParade output.
  PilobolusApiId:
    Type: String
    Description: AppSync API id of the Pilobolus backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdPilobolus output.
  ShippedApiId:
    Type: String
    Description: AppSync API id of the Shipped backend, whose procedures this runner may run. The release reads it from the papyrus-monitoring stack's ApiIdShipped output.
  MonitoringTableName:
    Type: String
    Description: The monitoring table, where the runner records each triggered run's outcome on its TRIGGER# row.
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: >-
      At most this many procedures run at once. 0 (the default) leaves it unreserved, for accounts whose
      Lambda concurrency quota is too low to reserve any (papyrus-production).

Conditions:
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - { Key: "anthus:account", Value: shared }
        - { Key: "anthus:app", Value: papyrus }
        - { Key: "anthus:cost-key", Value: shared/papyrus/ }
      LogGroupName: /aws/lambda/papyrus-procedure-runner
      RetentionInDays: 30

  RunnerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - { Key: "anthus:account", Value: shared }
        - { Key: "anthus:app", Value: papyrus }
        - { Key: "anthus:cost-key", Value: shared/papyrus/ }
      MessageRetentionPeriod: 1209600

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - { Key: "anthus:account", Value: shared }
        - { Key: "anthus:app", Value: papyrus }
        - { Key: "anthus:cost-key", Value: shared/papyrus/ }
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: papyrus-procedure-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RunnerLogGroup.Arn}:*"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RunnerDeadLetterQueue.Arn
              - Sid: PublicationOpenAiKeys
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/shared/*/OPENAI_API_KEY"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/*/*/OPENAI_API_KEY"
              - Sid: AgentModelKeyParameters
                Effect: Allow
                Action: ssm:GetParameter
                # The model key of runs a site's change feeds start (PPY-8a374e): the parameter a site names in `agents.openAiKeyParameter`, carried on the wake. Each parameter the
                # runner may read is named here, one ARN each, and nothing else under /papyrus/. The key is a SecureString under the AWS-managed alias/aws/ssm key,
                # which needs no kms:Decrypt grant. A site that names another parameter is a change to this list, through Git and the release.
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/papyrus/shipped/openai-api-key"
              - Sid: SiteAgentPolicyBody
                Effect: Allow
                Action: s3:GetObject
                # The body of a site's agent policy document, read before each run starts (PPY-c8175e). Only that document's objects, in any site's bucket.
                Resource: !Sub "arn:${AWS::Partition}:s3:::*/tenants/*/site/agents/*"
              - Sid: ReadWakeQueues
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                # The runner is the consumer of every site's wake queue (PPY-567bf9): one statement for all sites, by the queue name pattern
                # `papyrus-<site>-agent-wakes.fifo` (amplify/agents/wake-queue.ts). The dead-letter queues do not match it, so the runner cannot read them.
                Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:papyrus-*-agent-wakes.fifo"
              - Sid: TriggerOutcomes
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MonitoringTableName}"
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["MONITOR#*"]
              - Sid: StageTriggerRows
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MonitoringTableName}"
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["MONITOR#*"]
              - Sid: PutWakes
                Effect: Allow
                Action: [sqs:GetQueueUrl, sqs:SendMessage]
                # After a story-stage run the runner puts the next stage's wake on the same site's queue instead of invoking itself (PPY-567bf9). Send and look up only; no dead-letter queue matches.
                Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:papyrus-*-agent-wakes.fifo"
              - Sid: PublicationNewsrooms
                Effect: Allow
                Action: appsync:GraphQL
                Resource:
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DistinctiveApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DistinctiveApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${AnthUsApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${MachinesOnMachinesApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${MachinesOnMachinesApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ThreatIntelApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DataParadeApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${DataParadeApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PilobolusApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${PilobolusApiId}/types/Mutation/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ShippedApiId}/types/Query/fields/*"
                  - !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ShippedApiId}/types/Mutation/fields/*"

  RunnerFunction:
    Type: AWS::Lambda::Function
    DependsOn: RunnerLogGroup
    Properties:
      Tags:
        - { Key: "anthus:account", Value: shared }
        - { Key: "anthus:app", Value: papyrus }
        - { Key: "anthus:cost-key", Value: shared/papyrus/ }
      FunctionName: papyrus-procedure-runner
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt RunnerRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt RunnerDeadLetterQueue.Arn
      Environment:
        Variables:
          TRIGGER_TABLE_NAME: !Ref MonitoringTableName

  RunnerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RunnerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

Outputs:
  RunnerFunctionName:
    Value: !Ref RunnerFunction
  RunnerFunctionArn:
    Value: !GetAtt RunnerFunction.Arn
