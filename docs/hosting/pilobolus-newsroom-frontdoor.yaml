AWSTemplateFormatVersion: '2010-09-09'
Description: Existing Pilobolus CMS HTTPS front door; reader and authentication unchanged
Resources:
  ForwardHost:
    Type: AWS::CloudFront::Function
    Properties:
      Name: pilobol-us-cms-forward-host
      AutoPublish: true
      FunctionConfig:
        Comment: Preserve public CMS hostname while Amplify receives its origin Host
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.headers['x-forwarded-host'] = { value: 'newsroom.pilobol.us' };
          return request;
        }
  CmsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: newsroom.pilobol.us existing production CMS
        Aliases: [newsroom.pilobol.us]
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:712236451410:certificate/b3dc039b-973f-437b-9525-f5249e9f88ec
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: cms
            DomainName: main.d1eiwl0gedkmnj.amplifyapp.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: cms
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ForwardHost.FunctionARN
Outputs:
  DistributionId:
    Value: !Ref CmsDistribution
  DistributionDomain:
    Value: !GetAtt CmsDistribution.DomainName
