schemaVersion: 1
publication:
  name: "Pilobolus"
canonicalTopicSet:
  corpusKey: "pilobol-us"
  classifierId: "pilobol-us"
corpora:
  - key: "pilobol-us"
    name: "Pilobolus Field Notes Corpus"
    path: "corpora/pilobol-us"
    # Run `categories sandbox-steering-config` after `npm run outputs:sandbox` to
    # rewrite s3Prefix from the Ryan sandbox storage bucket in amplify_outputs.json.
    s3Prefix: "s3://pilobol-us-demo/corpora/pilobol-us/"
    role: "canonical"
    localClassifiers:
      - classifierId: "pilobol-us"
        label: "Fungus Among Us Topics"
  - key: "pilobol-us-source"
    name: "Pilobolus Source Intake"
    path: "corpora/pilobol-us-source"
    s3Prefix: "s3://pilobol-us-demo/corpora/pilobol-us-source/"
    role: "source"
    localClassifiers:
      - classifierId: "pilobol-us-source"
        label: "Pilobolus Source Intake"
