[project]
name = "papyrus-newsroom"
version = "0.1.0"
description = "Papyrus newsroom Python tools and CLI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyYAML >=6.0.2,<7.0.0",
    "citeproc-py >=0.8.2,<1.0.0",
]

[project.optional-dependencies]
markus = [
    "anthus-markus >=0.5.1,<1.0.0",
]
newsroom = [
    "boto3 >=1.34.0,<2.0.0",
    "markitdown[all] >=0.1.0,<1.0.0",
    "tiktoken >=0.12.0,<0.13.0",
    "tactus >=0.52,<1",
    "limatus >=0.17.0,<0.18.0",
]

[project.scripts]
papyrus = "papyrus.cli:main"

[tool.poetry]
packages = [
    { include = "papyrus", from = "src" },
    { include = "papyrus_newsroom", from = "src" },
    { include = "papyrus_knowledge_query", from = "src" },
    { include = "papyrus_content", from = "src" },
    { include = "papyrus_web", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
behave = "^1.2.6"
requests = "^2.32.3"
kanbus = ">=0.18.3"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["procedures/newsroom/tests", "publications/threat_intelligence/tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
