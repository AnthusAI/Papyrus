[project]
name = "papyrus-newsroom"
version = "0.1.0"
description = "Papyrus newsroom Python tools and CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyYAML >=6.0.2,<7.0.0",
    "citeproc-py >=0.8.2,<1.0.0",
    # The `papyrus` CLI imports limatus at import time, and Papyrus is
    # integrating it more deeply, so it is a base dependency (Ryan, 2026-10-05).
    "limatus >=0.29.0,<1",
]

[project.optional-dependencies]
markus = [
    "anthus-markus >=0.5.1,<1.0.0",
    "Pillow >=10,<12",
    "boto3 >=1.34.0,<2.0.0",
]
# The relevance cyclotron (Cyclotron's application SDK, the Jev decision model and
# the OpenAI optimizer adapter), pinned to one engine commit.
cyclotron = [
    "decision-flywheel[jev,optimizer] @ git+https://github.com/AnthusAI/Cyclotron.git@f1e18268d9e25b57e30e5953406b5add9d70c8fd",
]
newsroom = [
    "boto3 >=1.34.0,<2.0.0",
    "markitdown[all] >=0.1.0,<1.0.0",
    "tiktoken >=0.12.0,<0.13.0",
    "tactus >=0.52,<1",
]

[project.urls]
Homepage = "https://github.com/AnthusAI/Papyrus"
Repository = "https://github.com/AnthusAI/Papyrus"

[project.scripts]
papyrus = "papyrus.cli:main"

[tool.poetry]
packages = [
    { include = "papyrus", from = "src" },
    { include = "papyrus_newsroom", from = "src" },
    { include = "papyrus_knowledge_query", from = "src" },
    { include = "papyrus_content", from = "src" },
    { include = "papyrus_web", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
behave = "^1.2.6"
requests = "^2.32.3"
kanbus = ">=0.18.3"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["procedures/newsroom/tests", "publications/threat_intelligence/tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
