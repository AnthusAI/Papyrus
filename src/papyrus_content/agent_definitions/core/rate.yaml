schemaVersion: 1
id: rate
version: 2
responsibility: rate
procedure: rate_items
wakes:
  schedule: {cron: "30 3 * * *", timeZone: America/New_York}
serialBy: agent
paid: true
safeToRepeat: true
operations:
  guidelines_resolve: observe
  ratings_suggest: propose
  ratings_suggestions_review: propose
tier: bulk
template:
  trigger: Once a day by its schedule. It has no change trigger yet.
  inputs: Published Stories that have no rating, read newest first from the site's head stage index one page at a time, and the site's writing guidelines. Accepted References are not read yet, because no index lists the accepted References that have no stars.
  decision: For each unrated Story with no suggestion yet, three stars (the default), four stars (clearly better than the usual item), or a five-star candidate. Every answer is a suggestion for a person; none is ever a rating.
  mayWrite:
    - The run record, which lists each Story it looked at, the stars it suggested and why
    - A suggestion of three or four stars, or five for a five-star candidate, beside the rating of a Story nobody has rated, only at a rung that allows suggestions (propose)
    - One soft review per day, "N ratings suggested, M five-star candidates", linking each Story, only at a rung that allows suggestions
  mustNever:
    - Assign five stars, or write any rating; a rating is a person's alone
    - Suggest anything but three, four, or five as a candidate
    - Change or replace a rating a person gave, or suggest stars for a Story a person rated
    - Publish, unpublish, accept or reject a Story or a Reference
    - Write a suggestion or raise a review at a rung that does not allow it; at observe it writes nothing but its run record
  seenAndReversed: Beside each Story's rating in its editor, on the day's one soft review, and in the run record, which lists every Story with the stars and the reason. A person confirms a suggestion (it becomes their rating), rates other stars, or ignores it.
  records: One run record per wake, with the policy version and rung it ran under, the items it looked at and what it decided for each.
  fails: Closed. A failed run rates nothing and ends failed; a run that finds nothing unrated ends nothing with the reason nothing_unrated.
  costAndBound: One call to the bulk-tier model for each unrated Story the run reads, inside the site's weekly budget. No limit on the number of Stories; the run's own deadline ends the reading, and the run says so.
  measured: How often a person confirms a suggestion and how often they change it, and in which direction. The measure is a later task and has no spec yet.
  gherkin: [rating-agent-definition.feature, rating-agent.feature, rating-suggestions.feature]
