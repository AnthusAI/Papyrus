# Reusable workflow: start an Amplify RELEASE job for the commit that just passed CI on main,
# and wait for it. AWS access is GitHub OIDC only (no stored keys): the caller passes the
# `<siteId>-github-deploy` role from the Papyrus app shell, which trusts exactly
# repo:<owner>/<repo>:ref:refs/heads/main and may only amplify:StartJob/GetJob on that app's branch.
#
# Public repositories only. Private repositories get no free Actions minutes; their deploys run
# in AWS (CodePipeline/CodeBuild or Amplify's own repository-connected auto-build).
#
# Neither the AWS account id nor the Amplify app id belongs in the site repository. The caller keeps them
# in GitHub repository variables and passes them in (variables are not secrets; they simply stay out of Git):
#   AWS_ACCOUNT_ID    the 12-digit account the site deploys to
#   AMPLIFY_APP_ID    the Amplify app id (stack output CmsAppId)
#
# Caller (see infra/amplify-app-shell/examples/deploy-on-merge.workflow.yml):
#   deploy:
#     needs: ci
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     permissions: { id-token: write, contents: read }
#     uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
#     with:
#       app-id: ${{ vars.AMPLIFY_APP_ID }}
#       aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
#       role-name: <siteId>-github-deploy
#
# Backward compatible: a caller that still passes `role-to-assume` (a full role ARN) and a literal `app-id`
# keeps working, and `role-to-assume` wins over `aws-account-id` + `role-name` when both are given. When
# the app id or the role cannot be worked out the first step fails and says which variable to set.
name: Deploy to Amplify

on:
  workflow_call:
    inputs:
      app-id:
        description: Amplify app id (the CMS app, or the reader app for a reader-only site); pass vars.AMPLIFY_APP_ID
        required: false
        type: string
        default: ""
      aws-account-id:
        description: 12-digit AWS account id; pass vars.AWS_ACCOUNT_ID. Used with role-name to build the role ARN
        required: false
        type: string
        default: ""
      role-name:
        description: Name of the <siteId>-github-deploy role (not an id; used with aws-account-id)
        required: false
        type: string
        default: ""
      role-to-assume:
        description: Full ARN of the <siteId>-github-deploy role. Optional; wins over aws-account-id plus role-name
        required: false
        type: string
        default: ""
      branch-name:
        description: Amplify branch to build
        required: false
        type: string
        default: main
      region:
        required: false
        type: string
        default: us-east-1
      timeout-minutes:
        description: How long to wait for the Amplify job
        required: false
        type: number
        default: 60

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Work out the app and the role
        id: target
        env:
          APP_ID: ${{ inputs.app-id }}
          ACCOUNT_ID: ${{ inputs.aws-account-id }}
          ROLE_NAME: ${{ inputs.role-name }}
          ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ]; then
            echo "::error::No Amplify app id. Set the repository variable AMPLIFY_APP_ID and pass it as app-id (vars.AMPLIFY_APP_ID)"
            exit 1
          fi
          role="$ROLE_TO_ASSUME"
          if [ -z "$role" ]; then
            if [ -z "$ACCOUNT_ID" ] || [ -z "$ROLE_NAME" ]; then
              echo "::error::No deploy role. Set the repository variable AWS_ACCOUNT_ID and pass it as aws-account-id (vars.AWS_ACCOUNT_ID) with role-name: <siteId>-github-deploy (or pass role-to-assume)"
              exit 1
            fi
            case "$ACCOUNT_ID" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) echo "::error::aws-account-id must be a 12-digit AWS account id"; exit 1 ;;
            esac
            role="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
          fi
          echo "role=${role}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ inputs.region }}
          role-session-name: gh-deploy-${{ github.run_id }}

      - name: Start the Amplify job for this commit and wait for it
        env:
          APP_ID: ${{ inputs.app-id }}
          BRANCH_NAME: ${{ inputs.branch-name }}
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="$(printf '%s' "${COMMIT_MESSAGE:-deploy ${COMMIT_ID}}" | head -n 1 | cut -c1-200)"
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          # Amplify allows one running and one pending job per branch: an earlier merge's job may still
          # be running, so wait and retry instead of failing on LimitExceededException.
          while :; do
            if job_id="$(aws amplify start-job \
              --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --job-type RELEASE \
              --commit-id "$COMMIT_ID" --commit-message "$subject" \
              --query 'jobSummary.jobId' --output text 2>start-job.err)"; then break; fi
            if grep -q LimitExceededException start-job.err && [ "$(date +%s)" -lt "$deadline" ]; then
              echo "An earlier job is still running on ${APP_ID}/${BRANCH_NAME}; retrying in 30s"
              sleep 30
              continue
            fi
            cat start-job.err >&2
            exit 1
          done
          echo "Started Amplify job ${job_id} on ${APP_ID}/${BRANCH_NAME} for commit ${COMMIT_ID}"
          while :; do
            status="$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --job-id "$job_id" \
              --query 'job.summary.status' --output text)"
            echo "job ${job_id}: ${status}"
            case "$status" in
              SUCCEED) break ;;
              FAILED|CANCELLED) echo "::error::Amplify job ${job_id} ended ${status}"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "::error::Timed out waiting for job ${job_id}"; exit 1; fi
            sleep 20
          done
          {
            echo "### Amplify deploy"
            echo "- app \`${APP_ID}\`, branch \`${BRANCH_NAME}\`, job \`${job_id}\`"
            echo "- commit \`${COMMIT_ID}\`: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"
