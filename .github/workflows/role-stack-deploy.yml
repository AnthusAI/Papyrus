# The pipeline's own IAM roles (the papyrus-stack-pipeline stack) are changed here, and only here (PPY-9d1b3e).
#
#   merge to develop or main   `plan` makes a change set from the merged template and prints it, with an IAM view, as the job summary.
#                              Nothing to change: it ends quietly and nobody is asked for anything.
#   something to change        `apply` waits in the protected GitHub environment `pipeline-roles` for its required reviewer.
#                              One click to approve; it then executes that exact change set, polls it and verifies the result.
#
# Nobody applies these roles from a laptop, and an agent never approves. The roles this workflow runs as come from
# infra/pipeline/papyrus-pipeline-approver.yaml, a separate small stack a person sets up once per AWS account
# (infra/pipeline/bootstrap.sh --approver-only, then infra/pipeline/create-environment.sh). No stored keys: GitHub OIDC only.
# Only merged code runs here (develop or main), so only merged templates are applied; develop is allowed because the roles often
# have to change before the release that needs them. The account id lives in the AWS_ACCOUNT_ID repository variable.
name: role-stack-deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "infra/pipeline/papyrus-stack-pipeline.yaml"
      - "infra/pipeline/role_stack.py"
      - ".github/workflows/role-stack-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One at a time. A newer push replaces a run that has not started, never one that is mid-change.
concurrency:
  group: role-stack-deploy
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      change_set: ${{ steps.plan.outputs.change_set }}
      template_sha: ${{ steps.plan.outputs.template_sha }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - name: The AWS_ACCOUNT_ID variable is set
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: test -n "$ACCOUNT" || { echo "::error::Set the AWS_ACCOUNT_ID repository variable - see infra/pipeline/README.md (one-time setup)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/papyrus-pipeline-roles-plan-github
          aws-region: us-east-1
          role-session-name: roles-plan-${{ github.run_id }}
      - name: Plan (creates a change set, executes nothing)
        id: plan
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: python infra/pipeline/role_stack.py plan

  apply:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The approval: required reviewers on this environment, deployment branches limited to develop and main (infra/pipeline/create-environment.sh).
    # The role below trusts this environment's subject and nothing else.
    environment: pipeline-roles
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/papyrus-pipeline-roles-apply-github
          aws-region: us-east-1
          role-session-name: roles-apply-${{ github.run_id }}
      - name: Apply exactly the planned change set, then verify
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CHANGE_SET: ${{ needs.plan.outputs.change_set }}
          TEMPLATE_SHA: ${{ needs.plan.outputs.template_sha }}
          STAMP: ${{ needs.plan.outputs.stamp }}
        run: python infra/pipeline/role_stack.py apply --change-set "$CHANGE_SET" --template-sha "$TEMPLATE_SHA" --stamp "$STAMP"
