name: Release

on:
  push:
    branches: [main, develop]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/package-smoke.yml

  release:
    needs: smoke
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: npm ci
      - name: OIDC diagnostics (no secrets printed)
        run: |
          echo "npm $(npm --version), node $(node --version)"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}  NPM_TOKEN set: ${NPM_TOKEN:+yes}"
          npm config get registry
          cat ~/.npmrc 2>/dev/null | sed -E 's/(_authToken=).*/\1<redacted>/' || true
      - id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
      - if: steps.semantic.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist-packages/*.whl
            dist-packages/*.tar.gz

  pypi:
    needs: release
    if: ${{ vars.PUBLISH_ENABLED == 'true' && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
