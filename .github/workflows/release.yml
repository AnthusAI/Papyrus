name: Release

on:
  push:
    branches: [main, develop, 5.41.x]
    # Board-only commits (Kanbus issues and events) never release.
    paths-ignore:
      - "project/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/package-smoke.yml

  # A package release waits for the full test suite on this commit, not only the smoke test. An earlier green run of a byte-identical tree
  # counts (infra/pipeline/reuse_green_tests.py), so a merge that a pull request already tested does not run the suite twice.
  tests:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tests.yml

  release:
    needs: [smoke, tests]
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: npm ci
      - name: OIDC diagnostics (no secrets printed)
        run: |
          echo "npm $(npm --version), node $(node --version)"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}  NPM_TOKEN set: ${NPM_TOKEN:+yes}"
          npm config get registry
          cat ~/.npmrc 2>/dev/null | sed -E 's/(_authToken=).*/\1<redacted>/' || true
      - id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
      - name: Mark whether the release affects sites
        if: steps.semantic.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "v${RELEASE_VERSION}^")"
          marker="$(python3 procedures/release/classify_release.py classify --base "$previous_tag" --head "v${RELEASE_VERSION}")"
          notes="$(gh release view "v${RELEASE_VERSION}" --json body --jq .body)"
          gh release edit "v${RELEASE_VERSION}" --notes "${notes}"$'\n\n'"${marker}"
      - if: steps.semantic.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist-packages/*.whl
            dist-packages/*.tar.gz

  pypi:
    needs: release
    if: ${{ vars.PUBLISH_ENABLED == 'true' && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Git Flow back-merge: a stable release is tagged on main's merge commit, which develop never contains. Without this merge,
  # semantic-release on develop cannot see the stable tags and keeps numbering prereleases from an old version (5.43.0-next.N
  # after 5.66.0). Main only ever holds develop's commits plus these merge commits, so the merge never conflicts.
  back-merge:
    needs: [release, pypi]
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      # develop and main take changes only through a pull request with green `ts` and `python` (the ruleset, infra/pipeline/protect-branches.sh), so
      # the merge goes up as a pull request from its own branch. The workflow token cannot start the pull_request run, so the tests are dispatched on
      # the branch (tests.yml has workflow_dispatch) and report the same two checks on the branch tip, which is the pull request's tip.
      - name: Merge main into a branch and open the pull request
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="back-merge/v${RELEASE_VERSION}"
          git checkout -b "$branch"
          git merge --no-edit origin/main -m "chore: merge main back into develop after v${RELEASE_VERSION}"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" --title "chore: merge main back into develop after v${RELEASE_VERSION}" \
            --body "Git Flow back-merge of the v${RELEASE_VERSION} release (opened by release.yml). Merges itself when ts and python pass."
          gh workflow run tests.yml --ref "$branch"
          gh pr merge "$branch" --auto --merge
