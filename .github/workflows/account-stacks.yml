# Reusable workflow: a deployment repository deploys its own AWS account's stacks (DNS, budget, certificate, SES) from Git.
# Part of epic PPY-9bd776, "A Papyrus deployment needs no hand-made cloud resources". Public repositories only (free Actions minutes).
#
# The caller (see docs/account-pipeline.md for a complete example):
#   jobs:
#     account:
#       permissions: { contents: read, id-token: write }
#       uses: AnthusAI/Papyrus/.github/workflows/account-stacks.yml@<papyrus tag>
#       with: { prefix: myco, papyrus-ref: <the same tag>, aws-account-id: "${{ vars.AWS_ACCOUNT_ID }}" }
#
# What runs:
#   pull request   cfn-lint (no AWS), then a read-only plan with <prefix>-github-plan (same-repository pull requests only)
#   push to main   deploy the default group with <prefix>-github-deploy; if the account baseline stack (group "roles") differs from Git, a
#                  second job waits in the protected GitHub environment for a person, then applies it with <prefix>-github-roles-apply
# No stored keys: GitHub OIDC only. The account id is a repository variable, never in Git.
name: account-stacks

on:
  workflow_call:
    inputs:
      prefix:
        description: The deployment prefix the baseline stack was seeded with (roles are <prefix>-github-deploy and so on)
        required: true
        type: string
      aws-account-id:
        description: 12-digit AWS account id; pass vars.AWS_ACCOUNT_ID
        required: true
        type: string
      papyrus-ref:
        description: Papyrus tag or branch that holds stack_deploy.py and the account templates (pin the same tag as the uses line)
        required: false
        type: string
        default: main
      config:
        description: Path of the stack config in the calling repository
        required: false
        type: string
        default: infra/stacks.json
      lint-glob:
        description: Templates of the calling repository to lint
        required: false
        type: string
        default: infra/stacks/*.yaml
      approval-environment:
        description: GitHub environment with a required reviewer that guards changes to the baseline stack
        required: false
        type: string
        default: pipeline-roles
      region:
        required: false
        type: string
        default: us-east-1

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnthusAI/Papyrus
          ref: ${{ inputs.papyrus-ref }}
          path: .papyrus-tool
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cfn-lint==1.40.0 pyyaml
      - name: Lint the templates (no AWS access)
        env:
          GLOB: ${{ inputs.lint-glob }}
        run: |
          cfn-lint $GLOB .papyrus-tool/infra/account/baseline.yaml .papyrus-tool/infra/account/stacks/*.yaml

  plan:
    needs: lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnthusAI/Papyrus
          ref: ${{ inputs.papyrus-ref }}
          path: .papyrus-tool
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.prefix }}-github-plan
          aws-region: ${{ inputs.region }}
          role-session-name: plan-${{ github.run_id }}
      - name: Plan (read-only)
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
          CONFIG: ${{ inputs.config }}
        run: |
          python .papyrus-tool/infra/pipeline/stack_deploy.py plan --config "$CONFIG"
          python .papyrus-tool/infra/pipeline/stack_deploy.py plan --config "$CONFIG" --group roles

  deploy:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: account-stacks-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      roles_changed: ${{ steps.roles.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnthusAI/Papyrus
          ref: ${{ inputs.papyrus-ref }}
          path: .papyrus-tool
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.prefix }}-github-deploy
          aws-region: ${{ inputs.region }}
          role-session-name: deploy-${{ github.run_id }}
      - name: Deploy the stacks
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
          CONFIG: ${{ inputs.config }}
          BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
        run: python .papyrus-tool/infra/pipeline/stack_deploy.py deploy --config "$CONFIG"
      - name: Does the account baseline differ from Git
        id: roles
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
          CONFIG: ${{ inputs.config }}
        run: python .papyrus-tool/infra/pipeline/stack_deploy.py changed --config "$CONFIG" --group roles

  roles:
    needs: deploy
    if: needs.deploy.outputs.roles_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A person approves this environment before the job starts; that click is the control.
    environment: ${{ inputs.approval-environment }}
    concurrency:
      group: account-stacks-roles-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnthusAI/Papyrus
          ref: ${{ inputs.papyrus-ref }}
          path: .papyrus-tool
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.prefix }}-github-roles-apply
          aws-region: ${{ inputs.region }}
          role-session-name: roles-${{ github.run_id }}
      - name: Apply the account baseline
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
          CONFIG: ${{ inputs.config }}
        run: python .papyrus-tool/infra/pipeline/stack_deploy.py deploy --config "$CONFIG" --group roles
