name: Package smoke

on:
  workflow_call:
  pull_request:
    paths:
      - "packages/**"
      - "lib/**"
      - "amplify/**"
      - "app/**"
      - "components/**"
      - "renderers/**"
      - "src/**"
      - "pyproject.toml"
      - "package.json"
      - "release.config.cjs"
      - "scripts/check-consumer-site-typecheck.mjs"
      - "scripts/check-github-tarball-pins.mjs"
      - ".github/workflows/package-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: npm ci
      - run: node packages/stage.mjs --version 0.0.0-smoke.1
      - run: node packages/verify-packages.mjs 0.0.0-smoke.1
      - run: node scripts/check-consumer-site-typecheck.mjs dist-packages/anthusai-papyrus-0.0.0-smoke.1.tgz

  # Installs the packed tarball into a site-shaped fixture (zod 3.25 override, as every site pins) and runs
  # `next build`, so a dependency of the app shell that breaks a consumer build fails here, not in Amplify.
  consumer-site-build:
    name: consumer-site-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: npm ci
      - run: node packages/stage.mjs --version 0.0.0-smoke.1
      - run: node scripts/check-consumer-site-typecheck.mjs dist-packages/anthusai-papyrus-0.0.0-smoke.1.tgz --build

  # The documented install is `pipx install papyrus-newsroom`, with no extras. Saving a story version derives
  # bodyIr with Markus, so a plain install must be able to do that (PPY-a4ae21). Pictures (`stories save-version --images`,
  # `stories repair-image-paths`, `ops content renditions`) need boto3 and Pillow, so the job also imports and runs those
  # code paths with no extras: a dependency that slips back into an extra fails here (PPY-a89c4d).
  cli-clean-install:
    name: cli-clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv "$RUNNER_TEMP/plain" && "$RUNNER_TEMP/plain/bin/pip" install .
      - name: A plain install derives a story body
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/plain/bin/python" -c "
          from papyrus_content.markus_renderer.derive import derive_body
          result = derive_body(None, '# A heading\n\nA paragraph.\n')
          assert result.ok, result.errors
          "
      - name: A plain install can reach the picture code paths
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/plain/bin/python" -c "
          import io
          import PIL.Image
          from papyrus_content import story_images, media_store, renditions_commands, story_commands
          from papyrus_content.story_images import _cognito_identity_client, _s3_client, read_dimensions
          from papyrus_content.media_store import S3MediaStore
          import botocore.exceptions
          # The same clients the commands build, with no network call: boto3 is importable and constructs them.
          _cognito_identity_client('us-east-1')
          _s3_client({'AccessKeyId': 'a', 'SecretKey': 'b', 'SessionToken': 'c'}, 'us-east-1')
          S3MediaStore('example-bucket', region='us-east-1')
          buffer = io.BytesIO()
          PIL.Image.new('RGB', (3, 2)).save(buffer, 'PNG')
          from pathlib import Path
          Path('probe.png').write_bytes(buffer.getvalue())
          assert read_dimensions(Path('probe.png'), buffer.getvalue()) == (3, 2)
          import importlib
          for name in ('papyrus_content.story_image_repair', 'papyrus_content.references_commands', 'papyrus_content.newsroom_commands'):
              importlib.import_module(name)
          "

  github-tarball-pins:
    name: github-tarball-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-github-tarball-pins.mjs
        env:
          GH_TOKEN: ${{ github.token }}
