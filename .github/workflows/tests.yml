name: tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # amplify_outputs.json is generated per deployment and git-ignored; typecheck
      # only needs the module to resolve, so an empty stub stands in. No secrets.
      - run: echo '{}' > amplify_outputs.json
      - run: npm run typecheck
      - run: npm run lint
      # Reader routes enumerate published editions from AppSync at build time. Staging drafts
      # mode skips that enumeration, so the build needs no deployed backend and no secrets.
      - run: npm run build
        env:
          SITE_ENV: staging
          PAPYRUS_CONTENT_SOURCE: drafts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: infra/amplify-app-shell
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --no-interaction --extras "newsroom markus priming" --with cyclotron
      - name: Biblicus is the released PyPI package
        run: |
          poetry run python -c "import biblicus, sys; assert 'site-packages' in biblicus.__file__, biblicus.__file__"
          poetry run biblicus --help > /dev/null
      - name: Pilot identifiers stay out of application logic
        run: python procedures/guards/check_pilot_identifiers.py
      # Explicit exclusions, each with a reason; nothing is skipped silently.
      #   test_content_cli_live          live: needs AWS credentials for the papyrus-authoring role, PAPYRUS_GRAPHQL_ENDPOINT and network
      #   test_references_commands       PPY-c22e1c (stale assertions)
      #   test_tavily_research           PPY-c22e1c (stale assertions)
      #   test_relations_commands        PPY-c22e1c (stale assertions)
      #   test_analysis_entity_graph_bridge  PPY-c22e1c (stale assertions)
      #   test_cloud_procedure_execution PPY-c22e1c (stale assertions)
      #   test_newsroom_tools            PPY-7e2ca6 (needs local poetry/Biblicus/corpora)
      #   test_papyrus_content           PPY-7e2ca6 (needs local uv/corpora)
      #   publication_modes_test vetting PPY-a1867d (loads a fixtures file that was never committed)
      - name: Python unit tests
        run: |
          poetry run pytest -q \
            --ignore=procedures/newsroom/tests/test_content_cli_live.py \
            --ignore=procedures/newsroom/tests/test_references_commands.py \
            --ignore=procedures/newsroom/tests/test_tavily_research.py \
            --ignore=procedures/newsroom/tests/test_relations_commands.py \
            --ignore=procedures/newsroom/tests/test_analysis_entity_graph_bridge.py \
            --ignore=procedures/newsroom/tests/test_cloud_procedure_execution.py \
            --ignore=procedures/newsroom/tests/test_newsroom_tools.py \
            --ignore=procedures/newsroom/tests/test_papyrus_content.py \
            --deselect src/papyrus_content/publication_modes_test.py::test_existing_papyrus_curation_can_be_vetted_with_explicit_publication_feedback_in_both_modes
      # Excluded features, PPY-c22e1c (stale steps/assertions):
      #   editorial-style-profile (step imports removed _FORBIDDEN_KEY_PATTERN)
      #   research-reporting-context
      - run: poetry run behave features_backend --tags=~@live-agent --exclude 'editorial-style-profile|research-reporting-context'
