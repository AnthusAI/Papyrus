name: tests

on:
  # Also called by stack-deploy.yml, so a release's stacks deploy only after these pass on the commit that merged.
  workflow_call:
  pull_request:
    paths-ignore:
      - "project/**"
  push:
    branches: [develop]
    paths-ignore:
      - "project/**"

# A newer push to the same pull request or branch makes the older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same tree is tested up to four times per change (pull request, develop, release pull request, main). When an earlier run of this
  # workflow already passed on a byte-identical tree, the heavy jobs below are skipped and the summary names that run.
  # Any doubt - no match, a lookup error, a missing permission - runs everything. See infra/pipeline/reuse_green_tests.py.
  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      reused: ${{ steps.check.outputs.reused }}
    steps:
      # Default checkout: the merge ref on pull_request, which is exactly what the heavy jobs test, so its tree is the key.
      - uses: actions/checkout@v4
      - id: check
        run: python3 infra/pipeline/reuse_green_tests.py
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs only when every test job passed (or was justified by a reuse). Its name carries the tree it vouches for, which is how a
  # later run finds this one.
  record:
    needs: [reuse, ts, python]
    if: ${{ !cancelled() && needs.reuse.result == 'success' && (needs.reuse.outputs.reused == 'true' || (needs.ts.result == 'success' && needs.python.result == 'success')) }}
    name: tested-tree ${{ needs.reuse.outputs.tree }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "tree ${{ needs.reuse.outputs.tree }} passed (reused=${{ needs.reuse.outputs.reused }})"

  ts:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true'
    # Pinned: ubuntu-24.04 moved to 26.04, where Playwright cannot install Chromium (2026-10-31).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # amplify_outputs.json is generated per deployment and git-ignored; typecheck
      # only needs the module to resolve, so an empty stub stands in. No secrets.
      - run: echo '{}' > amplify_outputs.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:monitoring-receipt
      - run: node scripts/test-email-reference-handoff.cjs
      - run: npm run test:assignment-data-access
      - run: npm run test:public-forms
      - run: npm run test:alexa
      # Reader routes enumerate published editions from AppSync at build time. Staging drafts
      # mode skips that enumeration, so the build needs no deployed backend and no secrets.
      - run: npm run build
        env:
          SITE_ENV: staging
          PAPYRUS_CONTENT_SOURCE: drafts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Shared chat browser acceptance
        run: npm run test:shared-chat
      - run: npm ci
        working-directory: infra/amplify-app-shell
      # The app-shell CDK app must type-check cleanly with no TS_NODE_TRANSPILE_ONLY escape hatch.
      - run: npm run build
        working-directory: infra/amplify-app-shell
      - run: npm test

  python:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --no-interaction --extras "newsroom markus priming" --with cyclotron
      - name: Biblicus is the released PyPI package
        run: |
          poetry run python -c "import biblicus, sys; assert 'site-packages' in biblicus.__file__, biblicus.__file__"
          poetry run biblicus --help > /dev/null
      - name: Pilot identifiers stay out of application logic
        run: python procedures/guards/check_pilot_identifiers.py
      # Explicit exclusions, each with a reason; nothing is skipped silently.
      #   test_content_cli_live          live: needs AWS credentials for the papyrus-authoring role, PAPYRUS_GRAPHQL_ENDPOINT and network
      #   test_references_commands       PPY-c22e1c (stale assertions)
      #   test_tavily_research           PPY-c22e1c (stale assertions)
      #   test_relations_commands        PPY-c22e1c (stale assertions)
      #   test_analysis_entity_graph_bridge  PPY-c22e1c (stale assertions)
      #   test_cloud_procedure_execution PPY-c22e1c (stale assertions)
      #   test_newsroom_tools            PPY-7e2ca6 (needs local poetry/Biblicus/corpora)
      #   test_papyrus_content           PPY-7e2ca6 (needs local uv/corpora)
      # Keep this boundary visible independently of broad-suite collection: it
      # imports and executes the real Lambda handler, including payload upload.
      - name: Pending Reference intake handler and concurrency
        run: poetry run pytest -vv procedures/newsroom/tests/test_reference_intake.py
      - name: Python unit tests
        run: |
          poetry run pytest -q \
            --ignore=procedures/newsroom/tests/test_content_cli_live.py \
            --ignore=procedures/newsroom/tests/test_references_commands.py \
            --ignore=procedures/newsroom/tests/test_tavily_research.py \
            --ignore=procedures/newsroom/tests/test_relations_commands.py \
            --ignore=procedures/newsroom/tests/test_analysis_entity_graph_bridge.py \
            --ignore=procedures/newsroom/tests/test_cloud_procedure_execution.py \
            --ignore=procedures/newsroom/tests/test_newsroom_tools.py \
            --ignore=procedures/newsroom/tests/test_papyrus_content.py
      # Excluded feature, PPY-c22e1c (stale steps/assertions): research-reporting-context
      # The curation-routes scenario drives the real Next route handlers (tsx) against a live peer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: poetry run behave features_backend --tags=~@live-agent --exclude 'research-reporting-context'
