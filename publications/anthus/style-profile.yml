schemaVersion: 1
publicationKey: anthus-blog
voice:
  name: Anth.us editorial
audience: Practicing AI and ML engineers, product developers, and technical leaders evaluating tools, cost, and risk.
headline:
  when: afterBody
  order:
    - title
    - subtitle
  title:
    key: title
  subtitle:
    key: excerpt
    role: articleSummary
tone:
  - Conversational but precise; enthusiastic without hype.
  - Peer-to-peer engineering voice, not marketing brochure prose.
sentenceStyle:
  - Use contractions and active voice.
  - Keep paragraphs focused; favor concrete nouns, numbers, and operational detail.
voicePatterns:
  - Opens contrastive sentences with "But" rather than "However" or "That said."
  - Contracts negatives in first person ("I don't," "I wasn't") rather than expanding them ("I do not," "I was not").
  - When cutting a reused lead-in phrase, prefer starting the replacement with a conjunction ("But," "So," "And") over a flat declarative restart.
  - Prefers short, plain follow-on clauses over compound abstractions ("have to" over "am required to").
structure:
  - Lead with the practical stake for the reader.
  - Move from trend or claim to mechanism, then to checks the reader can run.
  - State uncertainty explicitly when evidence is thin.
lexicon:
  prefer:
    - inspect
    - verify
    - latency
    - cost
    - failure modes
    - constraints
    - operational detail
  avoid:
    - transforming workflows
    - revolutionize
    - game-changing
    - leverage synergies
    - empty intensifiers without evidence
evidenceRules:
  - Prefer primary sources, official documentation, and attributable citations.
  - Label speculation and weak evidence explicitly.
  - Do not invent anecdotes, statistics, or citations.
  - Optimize for editorial quality, not detector scores or synthetic imperfection.
checks:
  uniformCadence: false
density:
  minWords: 400
  minLexicalDensity: 0.45
  maxGzipRatio: 0.35
rules:
  bannedPhrases:
    - coming soon
    - we're just getting started
  bannedIntensifiers:
    - revolutionary
    - seamless
    - game-changing
    - transformative
    - cutting-edge
    - unlock
    - leverage
referenceSamples:
