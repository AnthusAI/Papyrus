schemaVersion: 1
publicationKey: anthus-blog
voice:
  name: Anth.us editorial
audience: Practicing AI and ML engineers, product developers, and technical leaders evaluating tools, cost, and risk.
headline:
  when: afterBody
  order:
    - title
    - subtitle
  title:
    key: title
  subtitle:
    key: excerpt
    role: articleSummary
tone:
  - Conversational but precise; enthusiastic without hype.
  - Peer-to-peer engineering voice, not marketing brochure prose.
  - Every sentence is understood on first read, titles and captions included. Prose that imitates the texture of a person writing without carrying the content (idioms, metaphors, and knowing phrases assembled slightly off) reads as performed rather than said.
sentenceStyle:
  - Use contractions and active voice.
  - Keep paragraphs focused; favor concrete nouns, numbers, and operational detail.
voicePatterns:
  - Opens contrastive sentences with "But" rather than "However" or "That said."
  - Contracts negatives in first person ("I don't," "I wasn't") rather than expanding them ("I do not," "I was not").
  - When cutting a reused lead-in phrase, prefer starting the replacement with a conjunction ("But," "So," "And") over a flat declarative restart.
  - Prefers short, plain follow-on clauses over compound abstractions ("have to" over "am required to").
  - States a conclusion as a plain claim with its subject named, not as an aphorism that equates a concrete thing with an abstraction ("The scorecard is the contract.") or a fragment pair that reads as a slogan ("Not a demo. A habit.").
  - Makes the point inside the sentence instead of announcing afterwards that one was made ("That's the whole argument.").
  - Puts the plain fact on the page before any comparison, and never lets a metaphor stand in for the fact ("the calibration became the weather").
  - Names who did what instead of giving an abstract noun a person's job ("the pipeline learned to hesitate").
  - Writes the skipped step rather than compressing for terseness, and uses no trade idiom the writer would not say aloud to a client's CFO.
structure:
  - Lead with the practical stake for the reader.
  - Move from trend or claim to mechanism, then to checks the reader can run.
  - State uncertainty explicitly when evidence is thin.
lexicon:
  prefer:
    - inspect
    - verify
    - latency
    - cost
    - failure modes
    - constraints
    - operational detail
  avoid:
    - transforming workflows
    - revolutionize
    - game-changing
    - leverage synergies
    - empty intensifiers without evidence
evidenceRules:
  - Prefer primary sources, official documentation, and attributable citations.
  - Label speculation and weak evidence explicitly.
  - Do not invent anecdotes, statistics, or citations.
  - Optimize for editorial quality, not detector scores or synthetic imperfection.
checks:
  uniformCadence: false
density:
  minWords: 400
  minLexicalDensity: 0.45
  maxGzipRatio: 0.35
rules:
  bannedPhrases:
    - coming soon
    - we're just getting started
  bannedPatterns:
    - pattern: "\\b(?:That|This|Here|It)(?:'?s|(?:\\s+\\w+){0,2}\\s+(?:is|was))\\s+the (?:whole|entire|real|actual|only) (?:point|argument|story|game|trick|job|thing|idea|lesson|move)\\b"
      message: Announces that a point was made instead of making it. State the point as a plain claim.
    - pattern: "(?:^|[.!?]\\s+)Not (?:a|an|the) [^.!?\\n]{1,30}\\. (?:A|An|The) [^.!?\\n]{1,30}\\."
      message: Fragment pair reads as a slogan. Join it into one sentence with a verb.
    - pattern: "\\b(?:is|was) the (?:point|product|contract|whole thing)\\.(?:\\s|$)"
      message: Aphorism that equates a concrete thing with an abstraction. Say what the thing does instead.
    - pattern: "(?i)\\b(?:if you know, you know|you know the one)\\b"
      message: Assumes a shared shorthand the reader was never given.
  bannedIntensifiers:
    - revolutionary
    - seamless
    - game-changing
    - transformative
    - cutting-edge
    - unlock
    - leverage
