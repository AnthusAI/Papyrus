<!-- @dsCard group="Paper" height=208 subtitle="Hairline, section, soft, labelled" -->
<div id="root" style="padding:20px;background:var(--paper)"></div>
<script>
  const { Rule } = window.Papyrus;
  const React = window.React;
  const h = React.createElement;
  const note = { margin: "0 0 6px", fontFamily: "var(--font-label)", fontSize: "11px", fontWeight: 800, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--ink-muted)" };

  function Demo() {
    return h("div", { style: { display: "grid", gap: "18px", maxWidth: "520px" } }, [
      h("div", { key: 1 }, [h("p", { style: note, key: "n" }, "Hairline"), h(Rule, { key: "r" })]),
      h("div", { key: 2 }, [h("p", { style: note, key: "n" }, "Section"), h(Rule, { weight: "section", key: "r" })]),
      h("div", { key: 3 }, [h("p", { style: note, key: "n" }, "Soft"), h(Rule, { soft: true, key: "r" })]),
      h("div", { key: 4 }, h(Rule, { weight: "section", label: "National" })),
      h("div", { key: 5, style: { display: "flex", gap: "16px", height: "44px" } }, [
        h("p", { style: { margin: 0, fontFamily: "var(--font-reader)", fontSize: "14px", color: "var(--ink)" }, key: "a" }, "Column one"),
        h(Rule, { orientation: "vertical", key: "r" }),
        h("p", { style: { margin: 0, fontFamily: "var(--font-reader)", fontSize: "14px", color: "var(--ink)" }, key: "b" }, "Column two")
      ])
    ]);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
